spring.application.name=SocialHub

server.port=${PORT:8080}

# ???????????????????????????????????????
# DATABASE
# ???????????????????????????????????????

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ???????????????????????????????????????
# HIBERNATE
# ???????????????????????????????????????

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=false

# ???????????????????????????????????????
# FILE UPLOAD
# ???????????????????????????????????????

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ???????????????????????????????????????
# GOOGLE OAUTH
# ???????????????????????????????????????

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ???????????????????????????????????????
# MAIL
# ???????????????????????????????????????

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ???????????????????????????????????????
# CLOUDFLARE R2
# ???????????????????????????????????????

cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.public-url=${R2_PUBLIC_URL}

# ???????????????????????????????????????
# SESSION / COOKIE
# ???????????????????????????????????????

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
server.servlet.session.timeout=7d

# ???????????????????????????????????????
# FORWARDED HEADERS (RENDER / PROXY)
# ???????????????????????????????????????

server.forward-headers-strategy=framework

# ???????????????????????????????????????
# TOMCAT
# ???????????????????????????????????????

server.tomcat.max-swallow-size=100MB

# ???????????????????????????????????????
# LOGGING
# ???????????????????????????????????????

logging.level.root=INFO

# TEMP DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.org.hibernate.SQL=OFF