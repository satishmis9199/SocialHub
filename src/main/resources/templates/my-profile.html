<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg: #080810;
          --surface: #0f0f1a;
          --card: #141420;
          --card2: #1a1a2e;
          --border: rgba(255,255,255,0.07);
          --accent: #6c63ff;
          --accent2: #ff6584;
          --accent3: #43e8c8;
          --text: #f0efff;
          --muted: #7070a0;
          --muted2: #4a4a70;
          --radius: 16px;
          --radius-sm: 10px;
        }

        html { scroll-behavior: smooth; }

        body {
          font-family: 'Cabinet Grotesk', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          overflow-x: hidden;
        }

        body::before {
          content: '';
          position: fixed;
          top: -200px; left: -200px;
          width: 600px; height: 600px;
          background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
          pointer-events: none;
          z-index: 0;
        }
        body::after {
          content: '';
          position: fixed;
          bottom: -200px; right: -200px;
          width: 500px; height: 500px;
          background: radial-gradient(circle, rgba(255,101,132,0.1) 0%, transparent 70%);
          pointer-events: none;
          z-index: 0;
        }

        .page-wrap {
          position: relative;
          z-index: 1;
          max-width: 900px;
          margin: 0 auto;
          padding: 32px 20px 60px;
        }

        /* Skeleton */
        .skeleton {
          background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
          background-size: 400% 100%;
          animation: shimmer 1.4s infinite;
          border-radius: 8px;
        }
        @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

        @keyframes fadeSlideUp {
          from { opacity:0; transform:translateY(20px); }
          to   { opacity:1; transform:translateY(0); }
        }

        /* Profile Card */
        .profile-card {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 28px;
          position: relative;
          overflow: hidden;
          animation: fadeSlideUp .5s ease both;
        }

        .profile-card::before {
          content: '';
          position: absolute;
          top: 0; right: 0;
          width: 180px; height: 180px;
          background: radial-gradient(circle at top right, rgba(108,99,255,0.15), transparent 65%);
          pointer-events: none;
        }

        .cover-banner {
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 90px;
          background: linear-gradient(135deg, rgba(108,99,255,0.25), rgba(255,101,132,0.15), rgba(67,232,200,0.1));
          border-radius: var(--radius) var(--radius) 0 0;
        }

        .profile-top {
          display: flex;
          align-items: flex-end;
          gap: 20px;
          margin-top: 50px;
          position: relative;
        }

        .avatar-wrap { position: relative; flex-shrink: 0; }

        .profile-img {
          width: 96px; height: 96px;
          border-radius: 50%;
          object-fit: cover;
          border: 3px solid var(--bg);
          outline: 2px solid var(--accent);
          display: block;
          transition: transform .3s, outline-color .3s;
          cursor: pointer;
        }
        .profile-img:hover { transform: scale(1.04); outline-color: var(--accent2); }

        .online-dot {
          position: absolute;
          bottom: 4px; right: 4px;
          width: 14px; height: 14px;
          background: var(--accent3);
          border-radius: 50%;
          border: 2px solid var(--bg);
          box-shadow: 0 0 8px var(--accent3);
        }

        .change-avatar-btn {
          position: absolute;
          bottom: 2px; left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.8);
          color: #fff;
          font-size: 10px;
          padding: 2px 8px;
          border-radius: 20px;
          cursor: pointer;
          white-space: nowrap;
          border: none;
          display: none;
          font-family: inherit;
          font-weight: 600;
        }
        .avatar-wrap:hover .change-avatar-btn { display: block; }

        .profile-meta { flex: 1; }

        .username {
          font-family: 'Clash Display', sans-serif;
          font-size: 26px;
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: -0.5px;
        }
        .handle { color: var(--muted); font-size: 13px; margin-top: 2px; }
        .bio { color: #c0bfe0; font-size: 14px; margin-top: 8px; line-height: 1.55; max-width: 460px; }

        .profile-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag {
          background: var(--card2);
          border: 1px solid var(--border);
          color: var(--muted);
          font-size: 11px;
          padding: 3px 10px;
          border-radius: 20px;
          font-weight: 500;
        }
        .tag.accent { border-color: rgba(108,99,255,0.4); color: #a09af7; }

        .profile-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

        .btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 9px 18px;
          border-radius: var(--radius-sm);
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
          border: none;
          transition: all .2s;
          font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 0 20px rgba(108,99,255,0.3); }
        .btn-primary:hover { background: #7b73ff; transform: translateY(-1px); box-shadow: 0 4px 24px rgba(108,99,255,0.45); }
        .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
        .btn-danger { background: rgba(255,101,132,0.12); color: var(--accent2); border: 1px solid rgba(255,101,132,0.25); }
        .btn-danger:hover { background: rgba(255,101,132,0.2); transform: translateY(-1px); }

        /* Stats */
        .stats-row {
          display: flex;
          margin-top: 24px;
          border-top: 1px solid var(--border);
          padding-top: 20px;
        }
        .stat {
          flex: 1; text-align: center; cursor: pointer;
          padding: 8px 0; border-radius: var(--radius-sm);
          transition: background .2s; position: relative;
        }
        .stat:hover { background: var(--card2); }
        .stat:not(:last-child)::after {
          content: ''; position: absolute;
          right: 0; top: 20%; height: 60%; width: 1px;
          background: var(--border);
        }
        .stat-val {
          font-family: 'Clash Display', sans-serif;
          font-size: 22px; font-weight: 700; color: var(--text);
        }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Tabs */
        .tabs-wrap { margin-top: 28px; animation: fadeSlideUp .5s .15s ease both; }
        .tabs {
          display: flex; gap: 2px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius-sm);
          padding: 4px;
        }
        .tab {
          flex: 1; text-align: center; padding: 9px 0;
          font-size: 13px; font-weight: 500; cursor: pointer;
          border-radius: 8px; color: var(--muted); transition: all .2s;
        }
        .tab.active { background: var(--accent); color: #fff; box-shadow: 0 0 16px rgba(108,99,255,0.35); }
        .tab:not(.active):hover { color: var(--text); background: var(--card2); }

        .tab-content { display: none; margin-top: 20px; animation: fadeSlideUp .3s ease both; }
        .tab-content.visible { display: block; }

        /* Posts Grid */
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .post-thumb {
          aspect-ratio: 1;
          border-radius: var(--radius-sm);
          background: var(--card2);
          border: 1px solid var(--border);
          overflow: hidden; cursor: pointer; position: relative;
          transition: transform .25s;
        }
        .post-thumb:hover { transform: scale(1.03); }
        .post-thumb:hover .post-overlay { opacity: 1; }
        .post-overlay {
          position: absolute; inset: 0;
          background: rgba(8,8,16,0.6);
          opacity: 0; transition: opacity .2s;
          display: flex; align-items: center; justify-content: center;
          gap: 14px; font-size: 14px; font-weight: 600; color: #fff;
        }
        .post-placeholder {
          width: 100%; height: 100%;
          background: linear-gradient(135deg, var(--card2), var(--card));
          display: flex; align-items: center; justify-content: center;
          font-size: 28px; color: var(--muted2);
        }

        /* About Tab */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .about-card {
          background: var(--card); border: 1px solid var(--border);
          border-radius: var(--radius-sm); padding: 16px 18px;
        }
        .about-card-title {
          font-size: 11px; text-transform: uppercase;
          letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 10px;
        }
        .about-row {
          display: flex; align-items: center; gap: 8px;
          padding: 5px 0; font-size: 13px; color: #c0bfe0;
        }
        .about-row span:first-child { color: var(--muted); width: 16px; text-align: center; font-size: 15px; }

        /* Activity */
        .activity-item {
          display: flex; align-items: center; gap: 10px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 10px; padding: 12px 16px;
          transition: border-color .2s;
        }
        .follow-toggle.requested {
  border: 1px solid orange;
  color: orange;
}
        .activity-item:hover { border-color: rgba(108,99,255,0.3); }

        /* Modal */
        .modal-backdrop {
          position: fixed; inset: 0;
          background: rgba(0,0,0,0.75);
          backdrop-filter: blur(6px);
          z-index: 100; display: none;
          align-items: center; justify-content: center;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 28px; width: 100%; max-width: 460px;
          animation: fadeSlideUp .25s ease;
        }
        .modal-header {
          display: flex; align-items: center;
          justify-content: space-between; margin-bottom: 20px;
        }
        .modal-title { font-family: 'Clash Display', sans-serif; font-size: 20px; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: var(--text); }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
        .form-input, .form-textarea {
          width: 100%; background: var(--card2); border: 1px solid var(--border);
          border-radius: var(--radius-sm); color: var(--text);
          font-family: inherit; font-size: 14px; padding: 10px 14px;
          outline: none; transition: border-color .2s;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 80px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

        /* Users list in modal */
        .user-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 4px; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .user-item:last-child { border-bottom: none; }
        .user-avatar {
          width: 40px; height: 40px; border-radius: 50%;
          background: linear-gradient(135deg, var(--accent), var(--accent2));
          display: flex; align-items: center; justify-content: center;
          font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
          overflow: hidden;
        }
        .user-info { flex: 1; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-handle { font-size: 12px; color: var(--muted); }
        .follow-toggle {
          font-size: 12px; padding: 5px 14px; border-radius: 20px;
          border: 1px solid var(--accent); color: var(--accent);
          background: transparent; cursor: pointer;
          font-family: inherit; font-weight: 600; transition: all .2s;
        }
        .follow-toggle.following { background: var(--accent); color: #fff; }

        /* Toast */
        .toast {
          position: fixed; bottom: 30px; left: 50%;
          transform: translateX(-50%) translateY(80px);
          background: var(--card2); border: 1px solid var(--border);
          border-radius: 20px; padding: 10px 22px;
          font-size: 13px; font-weight: 500; color: var(--text);
          z-index: 200; transition: transform .3s ease;
          pointer-events: none; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: rgba(67,232,200,0.4); color: var(--accent3); }
        .toast.error   { border-color: rgba(255,101,132,0.4); color: var(--accent2); }

        #loadingState { display: block; }
        #mainContent  { display: none; }

        .skel-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
        .skel-cover { height: 90px; border-radius: 10px; }
        .skel-avatar { width: 96px; height: 96px; border-radius: 50%; margin-top: -20px; }
        .skel-line { height: 14px; border-radius: 6px; margin: 10px 0; }

        @media (max-width: 600px) {
          .posts-grid { grid-template-columns: repeat(2, 1fr); }
          .about-grid { grid-template-columns: 1fr; }
          .profile-top { flex-direction: column; align-items: flex-start; }
          .stat-val { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="page-wrap">

    <!-- Loading Skeleton -->
    <div id="loadingState">
        <div class="skel-card">
            <div class="skeleton skel-cover"></div>
            <div style="display:flex;gap:18px;padding-top:8px;">
                <div class="skeleton skel-avatar"></div>
                <div style="flex:1;margin-top:40px;">
                    <div class="skeleton skel-line" style="width:40%"></div>
                    <div class="skeleton skel-line" style="width:22%;height:10px;"></div>
                    <div class="skeleton skel-line" style="width:70%;height:10px;margin-top:16px;"></div>
                    <div class="skeleton skel-line" style="width:55%;height:10px;"></div>
                </div>
            </div>
            <div style="display:flex;gap:16px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);">
                <div class="skeleton skel-line" style="flex:1;height:42px;border-radius:10px;margin:0;"></div>
                <div class="skeleton skel-line" style="flex:1;height:42px;border-radius:10px;margin:0;"></div>
                <div class="skeleton skel-line" style="flex:1;height:42px;border-radius:10px;margin:0;"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">

        <div class="profile-card">
            <div class="cover-banner"></div>

            <div class="profile-top">
                <div class="avatar-wrap">
                    <img id="profilePic" class="profile-img" src="" alt="Profile"/>
                    <div class="online-dot" title="Online"></div>
                    <!-- API: POST /user/upload/avatar  (multipart/form-data, field: "avatar") -->
                    <button class="change-avatar-btn" onclick="document.getElementById('avatarInput').click()">Change</button>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)"/>
                </div>

                <div class="profile-meta">
                    <div class="username" id="username">—</div>
                    <div class="handle" id="handle">@—</div>
                    <div class="bio" id="bio"></div>
                    <div class="profile-tags" id="profileTags"></div>
                </div>
            </div>

            <!-- Stats  -->
            <div class="stats-row">
                <!-- GET /user/post/all → array length = postCount -->
                <div class="stat" onclick="switchTab('posts')">
                    <div class="stat-val" id="postCount">0</div>
                    <div class="stat-label">Posts</div>
                </div>
                <!-- GET /user/followers → { users:[], count } -->
                <div class="stat" onclick="openFollowModal('followers')">
                    <div class="stat-val" id="followersCount">0</div>
                    <div class="stat-label">Followers</div>
                </div>
                <!-- GET /user/following → { users:[], count } -->
                <div class="stat" onclick="openFollowModal('following')">
                    <div class="stat-val" id="followingCount">0</div>
                    <div class="stat-label">Following</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="profile-actions">
                <!-- PUT /user/post/profile/update  body:{username,bio,location,website} -->
                <button class="btn btn-primary" onclick="openEditModal()">✏️ Edit Profile</button>
                <!-- Web Share API / navigator.clipboard -->
                <button class="btn btn-ghost" onclick="shareProfile()">🔗 Share</button>
                <!-- POST /auth/logout -->
                <button class="btn btn-danger" onclick="logout()">⏏ Logout</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-wrap">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('posts')">📸 Posts</div>
                <div class="tab" onclick="switchTab('about')">👤 About</div>
                <div class="tab" onclick="switchTab('activity')">⚡ Activity</div>
            </div>

            <!-- Posts Tab — GET /user/post/all → [{id, thumbnail, likesCount, commentsCount}] -->
            <div class="tab-content visible" id="tab-posts">
                <div class="posts-grid" id="postsGrid"></div>
                <p id="noPosts" style="display:none;text-align:center;padding:40px 0;color:var(--muted);">No posts yet.</p>
            </div>

            <!-- About Tab -->
            <div class="tab-content" id="tab-about">
                <div class="about-grid">
                    <div class="about-card">
                        <div class="about-card-title">Info</div>
                        <div class="about-row"><span>📍</span><span id="aLocation">—</span></div>
                        <div class="about-row"><span>🌐</span><a id="aWebsite" href="#" style="color:var(--accent);text-decoration:none;" target="_blank">—</a></div>
                        <div class="about-row"><span>📅</span><span id="aJoined">—</span></div>
                        <div class="about-row"><span>📧</span><span id="aEmail">—</span></div>
                    </div>
                    <div class="about-card">
                        <div class="about-card-title">Stats</div>
                        <div class="about-row"><span>❤️</span><span>Total Likes: <b id="aTotalLikes">0</b></span></div>
                        <div class="about-row"><span>💬</span><span>Comments: <b id="aTotalComments">0</b></span></div>
                        <div class="about-row"><span>👁️</span><span>Profile Views: <b id="aViews">0</b></span></div>
                    </div>
                    <div class="about-card" style="grid-column:1/-1;">
                        <div class="about-card-title">Bio</div>
                        <p id="aFullBio" style="font-size:14px;color:#c0bfe0;line-height:1.6;">—</p>
                    </div>
                </div>
            </div>

            <!-- Activity Tab — GET /user/activity → [{type, message, time}] -->
            <div class="tab-content" id="tab-activity">
                <div id="activityList" style="display:flex;flex-direction:column;gap:8px;"></div>
                <p id="noActivity" style="display:none;text-align:center;padding:40px 0;color:var(--muted);">No recent activity.</p>
            </div>
        </div>

    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal-backdrop" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Edit Profile</div>
            <button class="modal-close" onclick="closeEditModal()">✕</button>
        </div>
        <!-- All fields → PUT /user/post/profile/update -->
        <div class="form-group">
            <label class="form-label">Display Name</label>
            <input class="form-input" id="editName" type="text" placeholder="Your name"/>
        </div>
        <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea class="form-textarea" id="editBio" placeholder="Tell people about yourself..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Location</label>
            <input class="form-input" id="editLocation" type="text" placeholder="City, Country"/>
        </div>
        <div class="form-group">
            <label class="form-label">Website</label>
            <input class="form-input" id="editWebsite" type="url" placeholder="https://yoursite.com"/>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Followers / Following Modal -->
<div class="modal-backdrop" id="followModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="followModalTitle">Followers</div>
            <button class="modal-close" onclick="closeFollowModal()">✕</button>
        </div>
        <div class="user-list" id="userList">
            <p style="color:var(--muted);font-size:13px;text-align:center;padding:16px;">Loading...</p>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const el = id => document.getElementById(id);
    /* ══════════════════════════════════════════════════
       API MAP — Plug in your base URL + adjust paths
    ══════════════════════════════════════════════════ */
    const API = {
      ME:            '/user/post/profile/me',       // GET  → profile data
      UPDATE:        '/user/post/profile/update',   // PUT  → body: {username, bio, location, website}
      UPLOAD_AVATAR: '/user/post/upload/avatar',         // POST → multipart/form-data  field: "avatar"
      MY_POSTS:      '/user/post/all',              // GET  → { posts: [{id, thumbnail, likesCount, commentsCount}] }
      FOLLOWERS:     '/user/followers',             // GET  → { users: [{id, username, handle, profilePic, isFollowing}], count }
      FOLLOWING:     '/user/following',             // GET  → { users: [...], count }
     TOGGLE_FOLLOW:  '/user/follow/toggle',
      ACTIVITY:      '/user/activity',              // GET  → { activities: [{type, message, time}] }
      LOGOUT:        '/api/logout',                // POST → end session
    };

    /* ══════════════════════════════════════════════════
       LOAD PROFILE   GET /user/post/profile/me
    ══════════════════════════════════════════════════ */
    async function loadProfile() {
      try {
        const res = await fetch(API.ME, { method: 'GET', credentials: 'include' });
        console.log("PROFILE RESPONSE STATUS =", res.status);

const text = await res.text();

console.log("RAW RESPONSE =", text);

if (!res.ok) {
   throw new Error(`Status ${res.status}`);
}

const d = JSON.parse(text);

console.log("PROFILE DATA =", d);

        el('profilePic').src       = d.profilePic || 'https://i.pravatar.cc/150?u=' + d.username;
        el('username').innerText   = d.username    || 'Unknown';
        el('handle').innerText     = '@' + (d.handle || d.username || '').toLowerCase();
        el('bio').innerText        = d.bio         || '';
        el('aFullBio').innerText   = d.bio         || 'No bio yet.';
        el('aEmail').innerText     = d.email       || '—';
        el('aLocation').innerText  = d.location    || '—';
        el('aViews').innerText     = d.profileViews     || 0;
        el('aTotalLikes').innerText    = d.totalLikes    || 0;
        el('aTotalComments').innerText = d.totalComments || 0;

        if (d.website) {
          el('aWebsite').innerText = d.website;
          el('aWebsite').href      = d.website;
        }
        if (d.createdAt) {
          el('aJoined').innerText = 'Joined ' +
            new Date(d.createdAt).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }

        el('postCount').innerText      = d.postCount      || 0;
        el('followersCount').innerText = d.followersCount || 0;
        el('followingCount').innerText = d.followingCount || 0;

        if (d.tags?.length) {
          el('profileTags').innerHTML = d.tags.map((t,i) =>
            `<span class="tag ${i===0?'accent':''}">${t}</span>`).join('');
        }

        /* Pre-fill edit modal */
        el('editName').value     = d.username || '';
        el('editBio').value      = d.bio      || '';
        el('editLocation').value = d.location || '';
        el('editWebsite').value  = d.website  || '';

        el('loadingState').style.display = 'none';
        el('mainContent').style.display  = 'block';

        loadPosts();
        loadActivity();

      } catch (err) {
        console.error(err);
        showToast('Session expired or not logged in', 'error');
       setTimeout(() => {
   window.location.href = '/api/login';
}, 2200);
      }
    }

    /* ══════════════════════════════════════════════════
       LOAD POSTS   GET /user/post/all
       Response: { posts: [{id, thumbnail, likesCount, commentsCount}] }
    ══════════════════════════════════════════════════ */
    async function loadPosts() {
      try {
        const res  = await fetch(API.MY_POSTS, { credentials: 'include' });
        const d    = await res.json();
        const posts = d.posts || [];

        if (!posts.length) { el('noPosts').style.display = 'block'; return; }

        el('postsGrid').innerHTML = posts.map(p => `
          <div class="post-thumb" onclick="openPost('${p.id}')">
            ${p.thumbnail
              ? `<img src="${p.thumbnail}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"/>`
              : `<div class="post-placeholder">🖼️</div>`}
            <div class="post-overlay">
              <span>❤️ ${p.likesCount || 0}</span>
              <span>💬 ${p.commentsCount || 0}</span>
            </div>
          </div>`).join('');

        el('postCount').innerText = posts.length;
      } catch (e) { console.warn('Posts load error', e); }
    }

    /* ══════════════════════════════════════════════════
       LOAD ACTIVITY   GET /user/activity
       Response: { activities: [{type:'like'|'comment'|'follow'|'post', message, time}] }
    ══════════════════════════════════════════════════ */
    async function loadActivity() {
      try {
        const res  = await fetch(API.ACTIVITY, { credentials: 'include' });
        const d    = await res.json();
        const list = d.activities || [];

        if (!list.length) { el('noActivity').style.display = 'block'; return; }

        const icons = { like:'❤️', comment:'💬', follow:'👤', post:'📸' };
        el('activityList').innerHTML = list.map(a => `
          <div class="activity-item">
            <span style="font-size:18px;">${icons[a.type] || '⚡'}</span>
            <span style="font-size:13px;color:#c0bfe0;flex:1;">${a.message}</span>
            <span style="font-size:11px;color:var(--muted);">${timeAgo(a.time)}</span>
          </div>`).join('');
      } catch (e) { console.warn('Activity load error', e); }
    }

    /* ══════════════════════════════════════════════════
       SAVE PROFILE   PUT /user/post/profile/update
       Body: { username, bio, location, website }
       Response: { success: true, user: {...} }
    ══════════════════════════════════════════════════ */
    async function saveProfile() {
      const saveBtn = el('saveBtn');
      saveBtn.innerText = 'Saving…';
      saveBtn.disabled  = true;
      const body = {
        username: el('editName').value.trim(),
        bio:      el('editBio').value.trim(),
        location: el('editLocation').value.trim(),
        website:  el('editWebsite').value.trim(),
      };
      try {
        const res = await fetch(API.UPDATE, {
          method: 'PUT', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error('Update failed');
        closeEditModal();
        const data = await res.json();
        showToast(data.message, 'success');
        loadProfile();
      } catch (e) {
        showToast('Could not update profile', 'error');
      } finally {
        saveBtn.innerText = 'Save Changes';
        saveBtn.disabled  = false;
      }
    }

    /* ══════════════════════════════════════════════════
       UPLOAD AVATAR   POST /user/upload/avatar
       FormData field: "avatar"
       Response: { profilePic: "https://..." }
    ══════════════════════════════════════════════════ */
    async function uploadAvatar(input) {
      const file = input.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('avatar', file);
      showToast('Uploading…');
      try {
        const res = await fetch(API.UPLOAD_AVATAR, { method: 'POST', credentials: 'include', body: form });
        const d   = await res.json();
        el('profilePic').src = d.profilePic;
        showToast('Avatar updated!', 'success');
      } catch (e) { showToast('Upload failed', 'error'); }
      input.value = '';
    }

    /* ══════════════════════════════════════════════════
       FOLLOWERS / FOLLOWING MODAL
       GET /user/followers  or  GET /user/following
       Response: { users: [{id, username, handle, profilePic, isFollowing}] }
    ══════════════════════════════════════════════════ */
    async function openFollowModal(type) {
      el('followModalTitle').innerText = type === 'followers' ? 'Followers' : 'Following';
      el('userList').innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:16px;">Loading...</p>';
      el('followModal').classList.add('open');
      try {
        const url = type === 'followers' ? API.FOLLOWERS : API.FOLLOWING;
        const res = await fetch(url, { credentials: 'include' });
        const d   = await res.json();
        renderUserList(d.users || []);
      } catch (e) {
        el('userList').innerHTML = '<p style="color:var(--accent2);font-size:13px;text-align:center;padding:16px;">Failed to load.</p>';
      }
    }

    function renderUserList(users) {
      if (!users.length) {
        el('userList').innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:16px;">No users found.</p>';
        return;
      }
      el('userList').innerHTML = users.map(u => `
        <div class="user-item">
          <div class="user-avatar">
            ${u.profilePic
              ? `<img src="${u.profilePic}" style="width:100%;height:100%;object-fit:cover;"/>`
              : (u.username||'?')[0].toUpperCase()}
          </div>
          <div class="user-info">
            <div class="user-name">${u.username}</div>
            <div class="user-handle">@${u.handle || u.username}</div>
          </div>
         <button
  class="follow-toggle
    ${u.status === 'ACCEPTED' ? 'following' : ''}
    ${u.status === 'REQUESTED' ? 'requested' : ''}"

  onclick="toggleFollow(this,'${u.id}')">

  ${
    u.status === "ACCEPTED"
      ? "Following"
      : u.status === "REQUESTED"
      ? "Requested"
      : "Follow"
  }

</button>
        </div>`).join('');
    }

   async function toggleFollow(btn, userId) {
  try {
    // 🚫 multiple click रोकने के लिए
    if (btn.dataset.loading === "true") return;
    btn.dataset.loading = "true";

    const res = await fetch(API.TOGGLE_FOLLOW, {
      method: 'POST',
      credentials: 'include',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ targetUserId: userId })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Error");

    const status = data.followStatus;
    console.log("FOLLOW STATUS:", status);

    // 🎯 UI update (ONLY backend state)
    if (status === "FOLLOWING") {
      btn.innerText = "Following";
      btn.className = "follow-toggle following";
    }
    else if (status === "REQUESTED") {
      btn.innerText = "Requested";
      btn.className = "follow-toggle requested";
    }
    else {
      btn.innerText = "Follow";
      btn.className = "follow-toggle";
    }

    // 🔢 count safe update
    const fc = el('followingCount');
    let current = parseInt(fc.innerText) || 0;

    if (status === "FOLLOWING") {
      fc.innerText = current + 1;
    }
    else if (status === "NONE") {
      fc.innerText = Math.max(0, current - 1);
    }

  } catch (e) {
    showToast(e.message || "Action failed", "error");
  } finally {
    btn.dataset.loading = "false";
  }
}
    /* ══════════════════════════════════════════════════
       LOGOUT   POST /auth/logout
    ══════════════════════════════════════════════════ */
    async function logout() {
      if (!confirm('Do you want to Logout?')) return;
      try { await fetch(API.LOGOUT, { method: 'POST', credentials: 'include' }); } catch(e){}
      window.location.href = '/api/login';
    }

    /* ══════════════════════════════════════════════════
       SHARE PROFILE
    ══════════════════════════════════════════════════ */
    function shareProfile() {
      const url  = window.location.href;
      const name = el('username').innerText;
      if (navigator.share) {
        navigator.share({ title: name + "'s Profile", url });
      } else {
        navigator.clipboard.writeText(url);
        showToast('Profile link copied!', 'success');
      }
    }

    /* Open post page (adjust route as needed) */
    function openPost(id) { window.location.href = `/post/${id}`; }

    /* ── Tabs ── */
    const tabNames = ['posts','about','activity'];
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((t,i) =>
        t.classList.toggle('active', tabNames[i] === name));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('visible'));
      el('tab-' + name).classList.add('visible');
    }

    /* ── Modals ── */
    function openEditModal()   { el('editModal').classList.add('open'); }
    function closeEditModal()  { el('editModal').classList.remove('open'); }
    function closeFollowModal(){ el('followModal').classList.remove('open'); }

    el('editModal').addEventListener('click',  e => { if (e.target===el('editModal'))  closeEditModal(); });
    el('followModal').addEventListener('click', e => { if (e.target===el('followModal')) closeFollowModal(); });

    /* ── Toast ── */
    let _tt;
    function showToast(msg, type='') {
      const t = el('toast');
      t.innerText   = msg;
      t.className   = 'toast show ' + type;
      clearTimeout(_tt);
      _tt = setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ── Helpers ── */


    function timeAgo(d) {
      const s = (Date.now() - new Date(d)) / 1000;
      if (s < 60)    return 'just now';
      if (s < 3600)  return Math.floor(s/60)   + 'm ago';
      if (s < 86400) return Math.floor(s/3600)  + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    /* ── Init ── */
    loadProfile();
</script>
