<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

    <style>
        /* ─── RESET ─── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
          --bg:        #090909;
          --surface:   #111113;
          --surface2:  #1a1a1e;
          --surface3:  #222228;
          --border:    rgba(255,255,255,0.07);
          --border2:   rgba(255,255,255,0.13);
          --txt:       #f0f0f0;
          --txt2:      #888896;
          --txt3:      #555560;
          --accent:    #e8445a;
          --accent2:   #ff7040;
          --accent3:   #ffd060;
          --grad:      linear-gradient(135deg, #e8445a, #ff7040, #ffd060);
          --grad2:     linear-gradient(135deg, #e8445a 0%, #c0304a 100%);
          --radius:    14px;
          --radius-sm: 8px;
          --radius-lg: 20px;
          --font-head: 'Syne', sans-serif;
          --font-body: 'DM Sans', sans-serif;
          --nav-h:     60px;
          --trans:     all .25s cubic-bezier(.4,0,.2,1);
        }

        html { scroll-behavior: smooth; }

        body {
          font-family: var(--font-body);
          background: var(--bg);
          color: var(--txt);
          min-height: 100vh;
          overflow-x: hidden;
        }

        /* ─── TOAST ─── */
        #toastWrap {
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          gap: 10px;
          pointer-events: none;
          max-width: min(340px, calc(100vw - 32px));
        }

        .toast {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          padding: 13px 16px;
          border-radius: var(--radius);
          font-size: 13.5px;
          font-family: var(--font-body);
          font-weight: 400;
          line-height: 1.45;
          opacity: 0;
          transform: translateX(24px) scale(0.97);
          transition: all .35s cubic-bezier(.34,1.4,.64,1);
          pointer-events: none;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid;
        }
        .toast.show { opacity: 1; transform: translateX(0) scale(1); }
        .toast-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
        .toast-msg { flex: 1; }
        .toast.success { background: rgba(20,50,30,.92); border-color: rgba(60,160,90,.35); color: #6ee0a0; }
        .toast.error   { background: rgba(50,15,15,.92); border-color: rgba(200,60,60,.35); color: #f08080; }
        .toast.info    { background: rgba(15,25,55,.92); border-color: rgba(60,100,220,.35); color: #80a8f0; }
        .toast.warn    { background: rgba(50,35,10,.92); border-color: rgba(200,150,40,.35); color: #f0c060; }

        /* ─── NAVBAR ─── */
        .navbar {
          position: sticky;
          top: 0;
          z-index: 100;
          height: var(--nav-h);
          background: rgba(9,9,9,0.88);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--border);
          display: flex;
          align-items: center;
          padding: 0 20px;
        }
        .nav-inner {
          width: 100%;
          max-width: 640px;
          margin: auto;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .logo {
          font-family: var(--font-head);
          font-size: 20px;
          font-weight: 800;
          letter-spacing: -0.5px;
          background: var(--grad);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .nav-actions { display: flex; gap: 8px; }
        .nav-icon-btn {
          width: 36px;
          height: 36px;
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: 50%;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: var(--trans);
          color: var(--txt2);
          font-size: 16px;
        }
        .nav-icon-btn:hover { background: var(--surface3); border-color: var(--border2); color: var(--txt); }

        /* ─── CONTAINER ─── */
        .container {
          max-width: 640px;
          margin: auto;
          padding: 0 16px 80px;
        }

        /* ─── PROFILE HEADER ─── */
        .profile-header {
          padding: 24px 0 0;
          animation: fadeUp .5s ease both;
        }

        .profile-top {
          display: flex;
          align-items: flex-start;
          gap: 18px;
        }

        /* Avatar */
        .avatar-wrap {
          flex-shrink: 0;
          position: relative;
        }
        .avatar-ring {
          width: 86px;
          height: 86px;
          border-radius: 50%;
          padding: 2.5px;
          background: var(--grad);
          cursor: pointer;
          transition: transform .2s;
        }
        .avatar-ring:active { transform: scale(0.95); }
        .avatar-ring img {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          object-fit: cover;
          border: 3px solid var(--bg);
          display: block;
        }
        .live-dot {
          position: absolute;
          bottom: 4px;
          right: 4px;
          width: 13px;
          height: 13px;
          background: #2ecc71;
          border-radius: 50%;
          border: 2px solid var(--bg);
        }
        .live-dot::after {
          content: '';
          position: absolute;
          inset: -3px;
          border-radius: 50%;
          background: rgba(46,204,113,.4);
          animation: pulse 1.8s infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.6);opacity:0} }

        /* Profile meta */
        .profile-meta { flex: 1; min-width: 0; }
        .username-row {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
          margin-bottom: 8px;
        }
        .username {
          font-family: var(--font-head);
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.4px;
          color: var(--txt);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .verified-badge {
          width: 18px;
          height: 18px;
          background: var(--grad2);
          border-radius: 50%;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          font-size: 10px;
        }
        .private-pill {
          display: none;
          align-items: center;
          gap: 4px;
          background: rgba(232,68,90,.12);
          border: 1px solid rgba(232,68,90,.25);
          color: #f07080;
          font-size: 11px;
          font-weight: 500;
          padding: 2px 9px;
          border-radius: 20px;
        }
        .private-pill.show { display: inline-flex; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .follow-btn {
          height: 36px;
          padding: 0 20px;
          border: none;
          border-radius: var(--radius-sm);
          font-family: var(--font-body);
          font-size: 13.5px;
          font-weight: 500;
          cursor: pointer;
          transition: var(--trans);
          position: relative;
          overflow: hidden;
          white-space: nowrap;
        }
        .follow-btn::after {
          content: '';
          position: absolute;
          inset: 0;
          background: rgba(255,255,255,0);
          transition: background .15s;
        }
        .follow-btn:hover::after { background: rgba(255,255,255,.07); }
        .follow-btn:active { transform: scale(0.97); }
        .follow-btn.state-none {
          background: var(--grad2);
          color: #fff;
        }
        .follow-btn.state-requested {
          background: transparent;
          border: 1px solid rgba(200,150,40,.4);
          color: #f0c060;
        }
        .follow-btn.state-following {
          background: var(--surface3);
          border: 1px solid var(--border2);
          color: var(--txt2);
        }
        .follow-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .msg-btn {
          height: 36px;
          padding: 0 16px;
          border-radius: var(--radius-sm);
          background: var(--surface2);
          border: 1px solid var(--border);
          color: var(--txt2);
          font-family: var(--font-body);
          font-size: 13.5px;
          font-weight: 500;
          cursor: pointer;
          transition: var(--trans);
        }
        .msg-btn:hover { background: var(--surface3); border-color: var(--border2); color: var(--txt); }

        /* Stats */
        .stats-row {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          margin: 18px 0;
        }
        .stat-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 14px 10px;
          text-align: center;
          transition: var(--trans);
          cursor: default;
        }
        .stat-card:hover { background: var(--surface2); border-color: var(--border2); }
        .stat-num {
          font-family: var(--font-head);
          font-size: 20px;
          font-weight: 700;
          color: var(--txt);
          display: block;
          margin-bottom: 3px;
        }
        .stat-lbl {
          font-size: 11px;
          font-weight: 400;
          color: var(--txt3);
          text-transform: uppercase;
          letter-spacing: 0.8px;
        }

        /* Bio */
        .bio-section { margin-bottom: 6px; }
        .display-name {
          font-family: var(--font-head);
          font-size: 14px;
          font-weight: 600;
          color: var(--txt);
          margin-bottom: 3px;
        }
        .bio-text {
          font-size: 14px;
          color: var(--txt2);
          line-height: 1.55;
        }
        .bio-link {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          color: #e8778a;
          font-size: 13.5px;
          font-weight: 500;
          text-decoration: none;
          margin-top: 5px;
        }
        .bio-link:hover { text-decoration: underline; }

        /* ─── TABS ─── */
        .tabs {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          border-top: 1px solid var(--border);
          border-bottom: 1px solid var(--border);
          margin-bottom: 2px;
          margin-top: 16px;
        }
        .tab {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          padding: 13px 0;
          font-size: 13px;
          color: var(--txt3);
          cursor: pointer;
          border-bottom: 2px solid transparent;
          transition: var(--trans);
          font-weight: 500;
        }
        .tab.active { color: var(--txt); border-bottom-color: var(--accent); }
        .tab:hover:not(.active) { color: var(--txt2); }
        .tab-icon { font-size: 16px; line-height: 1; }

        /* ─── GRID ─── */
        .posts-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 2px;
        }

        .post-cell {
          position: relative;
          aspect-ratio: 1/1;
          overflow: hidden;
          background: var(--surface2);
          cursor: pointer;
        }
        .post-cell img, .post-cell video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          transition: transform .35s cubic-bezier(.4,0,.2,1);
        }
        .post-cell:hover img, .post-cell:hover video { transform: scale(1.06); }

        .post-overlay {
          position: absolute;
          inset: 0;
          background: rgba(0,0,0,.55);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          opacity: 0;
          transition: opacity .25s;
        }
        .post-cell:hover .post-overlay { opacity: 1; }
        .overlay-stat {
          display: flex;
          align-items: center;
          gap: 5px;
          color: #fff;
          font-size: 14px;
          font-weight: 600;
          font-family: var(--font-head);
        }

        /* Multi-image badge */
        .multi-badge {
          position: absolute;
          top: 6px;
          right: 6px;
          width: 20px;
          height: 20px;
          background: rgba(0,0,0,.65);
          border-radius: 4px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 10px;
        }

        /* Video badge */
        .video-badge {
          position: absolute;
          top: 6px;
          right: 6px;
          background: rgba(0,0,0,.65);
          border-radius: 4px;
          padding: 2px 5px;
          font-size: 10px;
          color: #fff;
          font-weight: 600;
        }

        /* Reel badge */
        .reel-badge {
          position: absolute;
          bottom: 6px;
          left: 6px;
          background: rgba(0,0,0,.65);
          border-radius: 4px;
          padding: 2px 6px;
          font-size: 10px;
          color: #fff;
          display: flex;
          align-items: center;
          gap: 3px;
        }

        /* ─── SKELETON ─── */
        .skeleton {
          aspect-ratio: 1/1;
          background: var(--surface2);
          position: relative;
          overflow: hidden;
        }
        .skeleton::after {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
          background-size: 300% 100%;
          animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

        /* ─── PRIVATE STATE ─── */
        .private-wrapper {
          grid-column: 1 / -1;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 70px 0;
        }
        .private-card {
          text-align: center;
          padding: 40px 30px;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          max-width: 280px;
          width: 100%;
        }
        .lock-circle {
          width: 64px;
          height: 64px;
          background: var(--surface2);
          border: 1px solid var(--border2);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
          margin: 0 auto 16px;
        }
        .private-card h3 {
          font-family: var(--font-head);
          font-size: 17px;
          font-weight: 700;
          color: var(--txt);
          margin-bottom: 6px;
        }
        .private-card p {
          font-size: 13.5px;
          color: var(--txt3);
          line-height: 1.5;
        }

        /* ─── EMPTY STATE ─── */
        .empty-wrapper {
          grid-column: 1 / -1;
          text-align: center;
          padding: 60px 20px;
          color: var(--txt3);
        }
        .empty-icon { font-size: 36px; margin-bottom: 10px; }
        .empty-wrapper p { font-size: 14px; }

        /* ─── HIGHLIGHT STORIES ROW ─── */
        .highlights-row {
          display: flex;
          gap: 14px;
          overflow-x: auto;
          padding: 16px 0 10px;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .highlights-row::-webkit-scrollbar { display: none; }
        .highlight-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          flex-shrink: 0;
          cursor: pointer;
        }
        .highlight-ring {
          width: 60px;
          height: 60px;
          border-radius: 50%;
          padding: 2px;
          background: var(--surface3);
          border: 1px solid var(--border2);
          transition: var(--trans);
        }
        .highlight-ring:hover { border-color: rgba(232,68,90,.5); }
        .highlight-ring img {
          width: 100%;
          height: 100%;
          border-radius: 50%;
          object-fit: cover;
          border: 2.5px solid var(--bg);
          display: block;
        }
        .highlight-name {
          font-size: 11px;
          color: var(--txt3);
          max-width: 60px;
          text-align: center;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(14px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .anim-delay-1 { animation-delay: .07s; animation-fill-mode: both; }
        .anim-delay-2 { animation-delay: .14s; animation-fill-mode: both; }
        .anim-delay-3 { animation-delay: .21s; animation-fill-mode: both; }

        /* ─── DESKTOP ADJUSTMENTS ─── */
        @media (min-width: 640px) {
          .container { padding: 0 24px 80px; }
          .avatar-ring { width: 96px; height: 96px; }
          .username { font-size: 22px; }
          .profile-top { gap: 24px; }
          .stat-num { font-size: 22px; }
        }

        @media (min-width: 900px) {
          .container { padding: 0 0 80px; }
          .posts-grid { gap: 3px; }
        }

        /* ─── SMALL MOBILE ─── */
        @media (max-width: 380px) {
          .navbar { padding: 0 14px; }
          .profile-top { gap: 14px; }
          .avatar-ring { width: 72px; height: 72px; }
          .username { font-size: 17px; }
          .stat-num { font-size: 17px; }
          .stat-card { padding: 12px 6px; }
        }

        /* ─── SPIN LOADER ─── */
        .spin-wrap {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          padding: 40px 0;
          grid-column: 1/-1;
        }
        .spinner {
          width: 28px;
          height: 28px;
          border: 2.5px solid var(--surface3);
          border-top-color: var(--accent);
          border-radius: 50%;
          animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- TOAST -->
<div id="toastWrap"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <span class="logo">SocialHub</span>
        <div class="nav-actions">
            <button class="nav-icon-btn" onclick="toast('Notifications coming soon','info')" title="Notifications">🔔</button>
            <button class="nav-icon-btn" onclick="toast('DMs coming soon','info')" title="Messages">✉️</button>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div class="container">

        <!-- PROFILE HEADER -->
        <section class="profile-header">
            <div class="profile-top">
                <!-- Avatar -->
                <div class="avatar-wrap">
                    <div class="avatar-ring" onclick="toast('Story view coming soon','info')">
                        <img id="profilePic" src="https://i.pravatar.cc/150?img=32" alt="Profile photo">
                    </div>
                    <div class="live-dot" id="liveDot" style="display:none"></div>
                </div>

                <!-- Meta -->
                <div class="profile-meta">
                    <div class="username-row">
                        <span class="username" id="username">Loading…</span>
                        <span class="verified-badge" id="verifiedBadge" title="Verified">✓</span>
                        <span class="private-pill" id="privatePill">🔒 Private</span>
                    </div>
                    <div class="btn-row">
                        <button class="follow-btn state-none" id="followBtn" onclick="toggleFollow()">Follow</button>
                        <button class="msg-btn" onclick="toast('Message feature coming soon','info')">Message</button>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-num" id="statPosts">—</span>
                    <span class="stat-lbl">Posts</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="statFollowers">—</span>
                    <span class="stat-lbl">Followers</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="statFollowing">—</span>
                    <span class="stat-lbl">Following</span>
                </div>
            </div>

            <!-- Bio -->
            <div class="bio-section">
                <div class="display-name" id="displayName"></div>
                <div class="bio-text" id="bioText"></div>
                <a href="#" class="bio-link" id="bioLink" style="display:none">🔗 <span id="bioLinkText"></span></a>
            </div>

            <!-- Highlights -->
            <div class="highlights-row" id="highlightsRow"></div>

        </section>

        <!-- TABS -->
        <div class="tabs" id="tabs">
            <div class="tab active" data-tab="posts" onclick="switchTab('posts')">
                <span class="tab-icon">⊞</span> Posts
            </div>
            <div class="tab" data-tab="reels" onclick="switchTab('reels')">
                <span class="tab-icon">▶</span> Reels
            </div>
            <div class="tab" data-tab="tagged" onclick="switchTab('tagged')">
                <span class="tab-icon">⊙</span> Tagged
            </div>
        </div>

        <!-- GRID -->
        <div class="posts-grid" id="postsGrid">
            <div class="spin-wrap"><div class="spinner"></div></div>
        </div>

    </div>
</main>

<script>
    /* ════════════════════════════════════
       CONFIG
    ════════════════════════════════════ */


    const USER_ID = window.location.pathname.split("/").filter(Boolean).pop();

    /* ════════════════════════════════════
       STATE
    ════════════════════════════════════ */
    let appState = {
      followStatus: "NONE",
      isPrivate: false,
      posts: [],
      reels: [],
      tagged: [],
      followersCount: 0,
      activeTab: "posts"
    };

    /* ════════════════════════════════════
       TOAST
    ════════════════════════════════════ */
    function toast(msg, type = "success", duration = 3500) {
      const icons = { success: "✓", error: "✕", info: "ℹ", warn: "⚠" };
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.innerHTML = `<span class="toast-icon">${icons[type] || "ℹ"}</span><span class="toast-msg">${msg}</span>`;
      wrap.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
      setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 400);
      }, duration);
    }

    /* ════════════════════════════════════
       FORMAT NUMBERS
    ════════════════════════════════════ */
    function fmt(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1_000)     return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    /* ════════════════════════════════════
       FOLLOW BUTTON UI
    ════════════════════════════════════ */
    function renderFollowBtn() {
      const btn = document.getElementById("followBtn");
      btn.classList.remove("state-none", "state-requested", "state-following");
      const s = appState.followStatus;
      if (s === "FOLLOWING") {
        btn.classList.add("state-following");
        btn.textContent = "Following";
      } else if (s === "REQUESTED") {
        btn.classList.add("state-requested");
        btn.textContent = "Requested";
      } else {
        btn.classList.add("state-none");
        btn.textContent = "Follow";
      }
    }

    /* ════════════════════════════════════
       TOGGLE FOLLOW
    ════════════════════════════════════ */
    async function toggleFollow() {
      const btn = document.getElementById("followBtn");
      const prev = appState.followStatus;
      btn.disabled = true;

      try {
        const res = await fetch(`/user/follow/toggle`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ targetUserId: USER_ID })
        });

       const data = await res.json();

<!--console.log("Backend Status:", data.followStatus);-->
console.log("Backend message : ",data.message);// 👈 यहाँ डालना है

        if (!res.ok) {
          // Backend sent error — show exact message
          throw new Error(data.message || `Error ${res.status}`);
        }

        appState.followStatus = data.followStatus;
        renderFollowBtn();

        const username = document.getElementById("username").textContent;

        if (data.followStatus === "FOLLOWING") {
          appState.followersCount++;
          document.getElementById("statFollowers").textContent = fmt(appState.followersCount);
          toast(`You're now following ${username}`, "success");
          if (appState.isPrivate) renderGrid(appState.posts);
        } else if (data.followStatus === "REQUESTED") {
          toast(`Follow request sent to ${username}`, "info");
        } else {
          appState.followersCount = Math.max(0, appState.followersCount - 1);
          document.getElementById("statFollowers").textContent = fmt(appState.followersCount);
          toast(`Unfollowed ${username}`, "warn");
          if (appState.isPrivate) showPrivate();
        }

        // Show any extra message from backend
        if (data.message && data.followStatus) {
          // optional extra toast from backend
        }

      } catch (err) {
        appState.followStatus = prev;
        renderFollowBtn();
        toast(err.message || "Something went wrong. Please try again.", "error");
      } finally {
        btn.disabled = false;
      }
    }

    /* ════════════════════════════════════
       TABS
    ════════════════════════════════════ */
    function switchTab(tab) {
      appState.activeTab = tab;
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === tab);
      });

      if (appState.isPrivate && appState.followStatus !== "FOLLOWING") {
        showPrivate();
        return;
      }

      if (tab === "posts")  renderGrid(appState.posts);
      if (tab === "reels")  renderGrid(appState.reels,  "reel");
      if (tab === "tagged") renderGrid(appState.tagged, "tagged");
    }

    /* ════════════════════════════════════
       GRID RENDERERS
    ════════════════════════════════════ */
    function showSkeleton() {
      const g = document.getElementById("postsGrid");
      g.innerHTML = Array(9).fill('<div class="skeleton"></div>').join('');
    }

    function showPrivate() {
      const g = document.getElementById("postsGrid");
      g.innerHTML = `
        <div class="private-wrapper">
          <div class="private-card">
            <div class="lock-circle">🔒</div>
            <h3>Private Account</h3>
            <p>Follow this account to see their photos and videos.</p>
          </div>
        </div>`;
    }

    function showEmpty(msg = "No posts yet") {
      const g = document.getElementById("postsGrid");
      g.innerHTML = `
        <div class="empty-wrapper">
          <div class="empty-icon">📷</div>
          <p>${msg}</p>
        </div>`;
    }

    function renderGrid(posts, type = "post") {
      const g = document.getElementById("postsGrid");

      if (!posts || posts.length === 0) {
        showEmpty(type === "reel" ? "No reels yet" : type === "tagged" ? "Not tagged in any posts" : "No posts yet");
        return;
      }

      g.innerHTML = "";
      posts.forEach((post, i) => {
        const cell = document.createElement("div");
        cell.className = "post-cell";
        cell.style.animationDelay = `${i * 0.03}s`;

        const media = post.media?.[0];
        const isVideo = media?.type === "VIDEO";
        const imgSrc = media
  ? media.url
  : `https://picsum.photos/seed/${i + 10}/400/400`;

        cell.innerHTML = `
          ${isVideo
            ? `<video src="${media.url}" muted></video>`
            : `<img src="${imgSrc}" alt="post" loading="lazy">`}
          <div class="post-overlay">
            <span class="overlay-stat">♥ ${fmt(post.likeCount || 0)}</span>
            <span class="overlay-stat">💬 ${fmt(post.commentCount || 0)}</span>
          </div>
          ${post.media?.length > 1 ? '<span class="multi-badge">⧉</span>' : ''}
          ${isVideo ? '<span class="video-badge">▶</span>' : ''}
          ${type === "reel" ? '<span class="reel-badge">▶ Reel</span>' : ''}
        `;

        cell.onclick = () => toast(`Post ${i + 1} — ${fmt(post.likeCount || 0)} likes`, "info", 2000);
        g.appendChild(cell);
      });
    }

    /* ════════════════════════════════════
       HIGHLIGHTS
    ════════════════════════════════════ */
    function renderHighlights(highlights) {
      const row = document.getElementById("highlightsRow");
      if (!highlights || highlights.length === 0) { row.style.display = "none"; return; }

      row.innerHTML = highlights.map((h, i) => `
        <div class="highlight-item" onclick="toast('${h.name} story','info',2000)">
          <div class="highlight-ring">
            <img src="${h.coverImage ?  + h.coverImage : `https://picsum.photos/seed/hl${i}/80/80`}" alt="${h.name}">
          </div>
          <span class="highlight-name">${h.name}</span>
        </div>
      `).join('');
    }

    /* ════════════════════════════════════
       LOAD PROFILE
    ════════════════════════════════════ */
    async function loadProfile() {
      showSkeleton();

      try {
        const res = await fetch(`/user/post/getUserProfile/${USER_ID}`, {
          credentials: "include"
        });

        if (!res.ok) throw new Error(`Server responded with ${res.status}`);

        const data = await res.json();
        console.log("Responsse ",data);

        // Populate UI
        document.getElementById("username").textContent    = data.username || "Unknown";
        document.getElementById("displayName").textContent = data.displayName || data.username || "";
        document.getElementById("bioText").textContent     = data.bio || "";

        if (data.website) {
          const bl = document.getElementById("bioLink");
          bl.style.display = "inline-flex";
          document.getElementById("bioLinkText").textContent = data.website.replace(/^https?:\/\//, '');
          bl.href = data.website;
        }

        appState.followersCount = data.followersCount || 0;
        document.getElementById("statPosts").textContent    = fmt(data.postsCount     || 0);
        document.getElementById("statFollowers").textContent = fmt(appState.followersCount);
        document.getElementById("statFollowing").textContent = fmt(data.followingCount || 0);

        if (data.profilePic) {
          document.getElementById("profilePic").src = data.profilePic;
        }

        if (!data.verified) document.getElementById("verifiedBadge").style.display = "none";
        if (data.isLive)    document.getElementById("liveDot").style.display = "block";

        appState.isPrivate    = !!data.private;
        appState.followStatus = data.followStatus || "NONE";
        appState.posts        = data.posts  || [];
        appState.reels        = data.reels  || [];
        appState.tagged       = data.tagged || [];

        if (appState.isPrivate) document.getElementById("privatePill").classList.add("show");

        renderFollowBtn();
        renderHighlights(data.highlights);

        if (appState.isPrivate && appState.followStatus !== "FOLLOWING") {
          showPrivate();
        } else {
          renderGrid(appState.posts);
        }

      } catch (err) {
        console.error(err);
        toast("Failed to load profile. Please refresh.", "error", 5000);
        document.getElementById("postsGrid").innerHTML = `
          <div class="empty-wrapper">
            <div class="empty-icon">⚠</div>
            <p>${err.message || "Could not load profile"}</p>
          </div>`;
      }
    }

    /* ════════════════════════════════════
       INIT
    ════════════════════════════════════ */
    document.getElementById("profilePic").onerror = function () {
      this.src = "https://i.pravatar.cc/150?img=32";
    };

    loadProfile();
</script>
</body>
</html>
