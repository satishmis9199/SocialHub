<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied | SocialHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        .icon {
            font-size: 60px;
            color: #ff4e50;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        p {
            color: gray;
            font-size: 14px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .home-btn {
            background: #007bff;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🚫</div>

    <h1>Access Denied</h1>

    <p>You do not have permission to view this page.</p>

    <button class="btn home-btn" onclick="goHome()">
        Go to Dashboard
    </button>

    <button class="btn logout-btn" onclick="logout()">
        Logout
    </button>

</div>

<script>

    function goHome() {
        window.location.href = "/user/dashboard";
    }

    function logout() {
        fetch("/api/logout", { method: "POST" })
        .then(() => {
            window.location.href = "/login";
        });
    }

</script>

</body>
</html>
