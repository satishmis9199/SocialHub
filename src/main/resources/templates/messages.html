<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SocialHub — Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:       #07070f;
          --surf:     #0f0f1c;
          --surf2:    #161625;
          --surf3:    #1e1e30;
          --surf4:    #26263a;
          --border:   rgba(255,255,255,0.07);
          --border2:  rgba(255,255,255,0.13);
          --accent:   #7c6af7;
          --accent2:  #f76ab4;
          --accent3:  #43e8c8;
          --grad:     linear-gradient(135deg,#7c6af7,#f76ab4);
          --txt:      #eeeeff;
          --txt2:     #8888b0;
          --txt3:     #4a4a70;
          --green:    #3ecf6e;
          --red:      #f87171;
          --font-h:   'Syne', sans-serif;
          --font-b:   'DM Sans', sans-serif;
          --r:        14px;
          --r-sm:     10px;
          --sidebar:  320px;
          --nav-h:    58px;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
          font-family: var(--font-b);
          background: var(--bg);
          color: var(--txt);
          display: flex;
          flex-direction: column;
        }

        /* ── Ambient ── */
        body::before {
          content: '';
          position: fixed; inset: 0; z-index: 0; pointer-events: none;
          background:
            radial-gradient(ellipse 55% 45% at 15% 15%, rgba(124,106,247,0.1) 0%, transparent 65%),
            radial-gradient(ellipse 45% 40% at 85% 85%, rgba(247,106,180,0.08) 0%, transparent 65%);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surf4); border-radius: 99px; }

        /* ══════════════════════════════
           TOPBAR
        ══════════════════════════════ */
        .topbar {
          position: relative; z-index: 10;
          height: var(--nav-h);
          background: rgba(7,7,15,0.9);
          backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center;
          padding: 0 18px; gap: 12px;
          flex-shrink: 0;
        }
        .back-btn {
          display: none;
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 50%; width: 34px; height: 34px;
          align-items: center; justify-content: center;
          color: var(--txt2); font-size: 18px; cursor: pointer;
          transition: all .2s; flex-shrink: 0;
        }
        .back-btn:hover { color: var(--txt); border-color: var(--border2); }
        .topbar-logo {
          font-family: var(--font-h); font-size: 19px; font-weight: 800;
          background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          flex-shrink: 0;
        }
        .topbar-title {
          font-family: var(--font-h); font-size: 16px; font-weight: 700;
          color: var(--txt); display: none;
        }
        .topbar-search {
          flex: 1; max-width: 260px;
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 99px; display: flex; align-items: center;
          padding: 0 12px; gap: 7px; transition: border-color .2s;
        }
        .topbar-search:focus-within { border-color: rgba(124,106,247,0.4); }
        .topbar-search input {
          background: none; border: none; outline: none;
          color: var(--txt); font-family: var(--font-b); font-size: 13px;
          padding: 7px 0; width: 100%;
        }
        .topbar-search input::placeholder { color: var(--txt3); }
        .search-icon { color: var(--txt3); font-size: 14px; }
        .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .t-btn {
          width: 34px; height: 34px; border-radius: 50%;
          background: var(--surf2); border: 1px solid var(--border);
          color: var(--txt2); font-size: 15px; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all .2s;
        }
        .t-btn:hover { background: var(--surf3); color: var(--txt); }

        /* ══════════════════════════════
           MAIN LAYOUT
        ══════════════════════════════ */
        .main {
          display: flex; flex: 1; overflow: hidden;
          position: relative; z-index: 1;
        }

        /* ══════════════════════════════
           SIDEBAR
        ══════════════════════════════ */
        .sidebar {
          width: var(--sidebar); flex-shrink: 0;
          background: var(--surf);
          border-right: 1px solid var(--border);
          display: flex; flex-direction: column;
          overflow: hidden; transition: transform .3s ease;
        }

        .sidebar-top {
          padding: 16px 14px 10px;
          border-bottom: 1px solid var(--border);
        }
        .sidebar-heading {
          font-family: var(--font-h); font-size: 18px; font-weight: 800;
          color: var(--txt); margin-bottom: 12px;
          display: flex; align-items: center; justify-content: space-between;
        }
        .new-chat-btn {
          background: var(--grad); border: none; border-radius: 50%;
          width: 28px; height: 28px; color: #fff; font-size: 18px;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; transition: opacity .2s; flex-shrink: 0;
        }
        .new-chat-btn:hover { opacity: .85; }

        .search-bar {
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 10px; display: flex; align-items: center;
          padding: 0 10px; gap: 7px; transition: border-color .2s;
        }
        .search-bar:focus-within { border-color: rgba(124,106,247,0.4); }
        .search-bar input {
          background: none; border: none; outline: none;
          color: var(--txt); font-family: var(--font-b); font-size: 13px;
          padding: 8px 0; width: 100%;
        }
        .search-bar input::placeholder { color: var(--txt3); }

        /* Tabs */
        .sidebar-tabs {
          display: flex; padding: 10px 14px 0;
          gap: 4px; border-bottom: 1px solid var(--border);
        }
        .s-tab {
          flex: 1; text-align: center; padding: 7px 0;
          font-size: 12px; font-weight: 600; cursor: pointer;
          color: var(--txt3); border-radius: 8px;
          transition: all .2s;
          text-transform: uppercase; letter-spacing: 0.5px;
        }
        .s-tab.active { background: rgba(124,106,247,0.15); color: var(--accent); }

        /* User list */
        .user-list { flex: 1; overflow-y: auto; padding: 8px 0; }

        .chat-user {
          display: flex; align-items: center; gap: 12px;
          padding: 11px 14px; cursor: pointer;
          transition: background .15s; position: relative;
          border-left: 3px solid transparent;
        }
        .chat-user:hover { background: var(--surf2); }
        .chat-user.active {
          background: var(--surf2);
          border-left-color: var(--accent);
        }

        .user-avatar-wrap { position: relative; flex-shrink: 0; }
        .user-av {
          width: 46px; height: 46px; border-radius: 50%;
          object-fit: cover; display: block;
          border: 2px solid var(--surf3);
        }
        .online-ring {
          position: absolute; bottom: 1px; right: 1px;
          width: 12px; height: 12px; border-radius: 50%;
          background: var(--green); border: 2px solid var(--surf);
          display: none;
        }
        .online-ring.show { display: block; }

        .user-info { flex: 1; min-width: 0; }
        .user-name-row {
          display: flex; align-items: center;
          justify-content: space-between; gap: 4px;
        }
        .user-name {
          font-size: 14px; font-weight: 600; color: var(--txt);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-time { font-size: 11px; color: var(--txt3); flex-shrink: 0; }
        .user-last-row {
          display: flex; align-items: center;
          justify-content: space-between; margin-top: 3px;
        }
        .user-last {
          font-size: 12.5px; color: var(--txt2);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          max-width: 160px;
        }
        .user-last.unread-msg { color: var(--txt); font-weight: 500; }
        .unread-badge {
          background: var(--accent); color: #fff;
          font-size: 10px; font-weight: 700;
          min-width: 18px; height: 18px; border-radius: 99px;
          display: flex; align-items: center; justify-content: center;
          padding: 0 5px; flex-shrink: 0;
        }

        /* Skeleton */
        .skel-user {
          display: flex; align-items: center; gap: 12px; padding: 11px 14px;
        }
        .sk { background: var(--surf2); border-radius: 6px; position: relative; overflow: hidden; }
        .sk::after {
          content: ''; position: absolute; inset: 0;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
          background-size: 300% 100%; animation: sk 1.5s infinite;
        }
        @keyframes sk { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
        .sk-circle { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
        .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
        .sk-line { height: 11px; border-radius: 4px; }

        /* ══════════════════════════════
           CHAT SECTION
        ══════════════════════════════ */
        .chat-section {
          flex: 1; display: flex; flex-direction: column; overflow: hidden;
          background: var(--bg);
        }

        /* Chat Header */
        .chat-header {
          display: flex; align-items: center; gap: 12px;
          padding: 12px 18px;
          background: var(--surf);
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }
        .ch-avatar-wrap { position: relative; }
        .ch-avatar {
          width: 42px; height: 42px; border-radius: 50%;
          object-fit: cover; border: 2px solid var(--surf3); display: block;
        }
        .ch-online {
          position: absolute; bottom: 1px; right: 1px;
          width: 11px; height: 11px; border-radius: 50%;
          background: var(--green); border: 2px solid var(--surf);
          display: none;
        }
        .ch-online.show { display: block; }
        .ch-info { flex: 1; min-width: 0; }
        .ch-name {
          font-family: var(--font-h); font-size: 15px; font-weight: 700; color: var(--txt);
        }
        .ch-status { font-size: 12px; color: var(--txt2); margin-top: 1px; }
        .ch-actions { display: flex; gap: 6px; }
        .ch-btn {
          width: 34px; height: 34px; border-radius: 50%;
          background: var(--surf2); border: 1px solid var(--border);
          color: var(--txt2); font-size: 15px; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all .2s;
        }
        .ch-btn:hover { background: var(--surf3); color: var(--txt); }

        /* Empty state */
        .chat-empty {
          flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          gap: 14px; color: var(--txt3);
        }
        .chat-empty-icon { font-size: 52px; opacity: .4; }
        .chat-empty h3 { font-family: var(--font-h); font-size: 18px; color: var(--txt2); }
        .chat-empty p  { font-size: 13px; color: var(--txt3); }

        /* Messages area */
        #chatBox {
          flex: 1; overflow-y: auto; padding: 18px 20px;
          display: flex; flex-direction: column; gap: 4px;
        }

        /* Date separator */
        .date-sep {
          display: flex; align-items: center; gap: 10px;
          margin: 12px 0; color: var(--txt3); font-size: 11px;
          text-transform: uppercase; letter-spacing: 0.8px;
        }
        .date-sep::before, .date-sep::after {
          content: ''; flex: 1; height: 1px;
          background: linear-gradient(to right, transparent, var(--border), transparent);
        }

        /* Message bubble */
        .msg-wrap {
          display: flex; gap: 8px; align-items: flex-end;
          animation: msgIn .25s ease both;
        }
        @keyframes msgIn {
          from { opacity: 0; transform: translateY(8px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .msg-wrap.mine { flex-direction: row-reverse; }

        .msg-av {
          width: 28px; height: 28px; border-radius: 50%;
          object-fit: cover; flex-shrink: 0; margin-bottom: 2px;
        }
        .msg-av.hide { visibility: hidden; }

        .bubble-wrap { display: flex; flex-direction: column; max-width: 65%; }
        .msg-wrap.mine .bubble-wrap { align-items: flex-end; }

        .bubble {
          padding: 10px 14px; border-radius: 18px;
          font-size: 14px; line-height: 1.5; color: var(--txt);
          word-break: break-word; position: relative;
        }
        .bubble.theirs {
          background: var(--surf2);
          border: 1px solid var(--border);
          border-bottom-left-radius: 4px;
        }
        .bubble.mine {
          background: var(--accent);
          color: #fff;
          border-bottom-right-radius: 4px;
        }

        /* Image message */
        .bubble.img-bubble { padding: 4px; background: var(--surf2); border: 1px solid var(--border); }
        .bubble.img-bubble img { width: 200px; border-radius: 14px; display: block; }
        .bubble.img-bubble.mine { background: var(--accent); }

        .msg-meta {
          display: flex; align-items: center; gap: 5px;
          font-size: 11px; color: var(--txt3); margin-top: 3px; padding: 0 4px;
        }
        .msg-wrap.mine .msg-meta { justify-content: flex-end; color: var(--txt3); }
      .seen-tick{

    color:#8be28b;

    font-size:13px;

    font-weight:bold;
}

.seen-tick-pending{

   color:#8be28b;

    font-size:13px;
}
        /* Typing indicator */
        .typing-bubble {
          display: flex; align-items: center; gap: 10px;
          padding: 10px 0; display: none;
        }
        .typing-bubble.show { display: flex; }
        .typing-dots { display: flex; gap: 4px; padding: 10px 14px; background: var(--surf2); border: 1px solid var(--border); border-radius: 18px; border-bottom-left-radius: 4px; }
        .typing-dots span {
          width: 7px; height: 7px; border-radius: 50%;
          background: var(--txt3);
          animation: dotBounce 1.2s ease infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes dotBounce {
          0%,60%,100% { transform: translateY(0); }
          30%          { transform: translateY(-6px); background: var(--accent); }
        }

        /* ── Input Area ── */
        .input-area {
          padding: 12px 16px;
          background: var(--surf);
          border-top: 1px solid var(--border);
          display: flex; align-items: flex-end; gap: 10px;
          flex-shrink: 0;
        }
        .input-actions { display: flex; gap: 6px; align-items: center; }
        .inp-btn {
          background: none; border: none; color: var(--txt3);
          font-size: 18px; cursor: pointer; padding: 6px;
          border-radius: 8px; transition: all .2s;
          display: flex; align-items: center; justify-content: center;
        }
        .inp-btn:hover { color: var(--accent); background: rgba(124,106,247,0.1); }
        .input-box {
          flex: 1; background: var(--surf2); border: 1px solid var(--border);
          border-radius: 22px; padding: 10px 16px;
          color: var(--txt); font-family: var(--font-b); font-size: 14px;
          outline: none; resize: none; max-height: 120px;
          transition: border-color .2s; line-height: 1.5;
          overflow-y: auto;
        }
        .input-box:focus { border-color: rgba(124,106,247,0.45); }
        .input-box::placeholder { color: var(--txt3); }
        .send-btn {
          width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
          background: var(--grad); border: none; color: #fff;
          font-size: 17px; cursor: pointer; display: flex;
          align-items: center; justify-content: center;
          transition: all .2s; box-shadow: 0 4px 16px rgba(124,106,247,0.3);
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(124,106,247,0.45); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* Emoji picker placeholder */
        .emoji-panel {
          display: none; flex-wrap: wrap; gap: 4px;
          padding: 10px 16px; background: var(--surf2);
          border-top: 1px solid var(--border);
          max-height: 0; overflow: hidden;
          transition: max-height .3s ease, padding .3s;
        }
        .emoji-panel.open { display: flex; max-height: 120px; }
        .emoji-btn {
          background: none; border: none; font-size: 22px;
          cursor: pointer; border-radius: 8px; padding: 4px 6px;
          transition: background .15s;
        }
        .emoji-btn:hover { background: var(--surf3); }

        /* ── No chat selected ── */
        .no-chat { display: flex; }
        .has-chat { display: none; }

        /* ── Toast ── */
        #toastWrap {
          position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
          z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 8px;
          pointer-events: none;
        }
        .toast {
          padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500;
          opacity: 0; transform: translateY(10px) scale(.96);
          transition: all .3s cubic-bezier(.34,1.4,.64,1);
          border: 1px solid; white-space: nowrap;
          backdrop-filter: blur(14px);
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
        .toast.success { background: rgba(20,45,28,.9); border-color: rgba(62,207,110,.3); color: #6ee0a0; }
        .toast.error   { background: rgba(48,14,14,.9);  border-color: rgba(248,113,113,.3); color: #f08080; }
        .toast.info    { background: rgba(14,24,50,.9);  border-color: rgba(124,106,247,.3); color: #a09af7; }

        /* ══════════════════════════════
           RESPONSIVE — MOBILE
        ══════════════════════════════ */
        @media (max-width: 680px) {
          :root { --sidebar: 100%; }

          .sidebar {
            position: absolute; inset: 0; top: var(--nav-h);
            z-index: 5; transform: translateX(0);
          }
          .sidebar.slide-out { transform: translateX(-100%); }

          .chat-section { position: absolute; inset: 0; top: var(--nav-h); }
          .chat-section.slide-out { transform: translateX(100%); }
          .chat-section, .sidebar { transition: transform .3s ease; }

          .back-btn { display: flex; }
          .topbar-logo { display: none; }
          .topbar-title { display: block; }
          .topbar-search { display: none; }

          .bubble-wrap { max-width: 80%; }
          #chatBox { padding: 14px 12px; }
          .input-area { padding: 10px 12px; }
        }
    </style>
</head>
<body>

<div id="toastWrap"></div>

<!-- ── TOPBAR ── -->
<header class="topbar">
    <button class="back-btn" id="backBtn" onclick="goBackToList()">←</button>
    <div class="topbar-logo">SocialHub</div>
    <div class="topbar-title" id="topbarTitle">Messages</div>
    <div class="topbar-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search conversations…" id="globalSearch" oninput="filterUsers(this.value)"/>
    </div>
    <div class="topbar-right">
        <button class="t-btn" onclick="location.href='/user/dashboard'" title="Home">🏠</button>
        <button class="t-btn" onclick="location.href='/user/myProfile'" title="Profile">👤</button>
    </div>
</header>

<div class="main">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-heading">
                Messages
                <button class="new-chat-btn" onclick="toast('New chat coming soon','info')" title="New Chat">＋</button>
            </div>
            <div class="search-bar">
                <span class="search-icon" style="color:var(--txt3);font-size:14px;">🔍</span>
                <input type="text" placeholder="Search people…" id="sideSearch" oninput="filterUsers(this.value)"/>
            </div>
        </div>

        <div class="sidebar-tabs">
            <div class="s-tab active" onclick="setTab(this,'all')">All</div>
            <div class="s-tab" onclick="setTab(this,'unread')">Unread</div>
            <div class="s-tab" onclick="setTab(this,'online')">Online</div>
        </div>

        <div class="user-list" id="userList">
            <!-- Skeletons -->
            <div class="skel-user"><div class="sk sk-circle"></div><div class="sk-lines"><div class="sk sk-line" style="width:55%"></div><div class="sk sk-line" style="width:75%"></div></div></div>
            <div class="skel-user"><div class="sk sk-circle"></div><div class="sk-lines"><div class="sk sk-line" style="width:40%"></div><div class="sk sk-line" style="width:65%"></div></div></div>
            <div class="skel-user"><div class="sk sk-circle"></div><div class="sk-lines"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:50%"></div></div></div>
        </div>
    </aside>

    <!-- ── CHAT SECTION ── -->
    <section class="chat-section slide-out" id="chatSection">

        <!-- Header -->
        <div class="chat-header" id="chatHeader">
            <div class="ch-avatar-wrap">
                <img class="ch-avatar" id="chatProfilePic" src="https://i.pravatar.cc/80" alt=""/>
                <div class="ch-online" id="chOnline"></div>
            </div>
            <div class="ch-info">
                <div class="ch-name" id="chatUsername">Select a conversation</div>
                <div class="ch-status" id="chatStatus"></div>
            </div>
            <div class="ch-actions">
                <button class="ch-btn" onclick="toast('Voice call coming soon','info')" title="Call">📞</button>
                <button class="ch-btn" onclick="toast('Video call coming soon','info')" title="Video">📹</button>
                <button class="ch-btn" onclick="toast('More options coming soon','info')" title="More">⋯</button>
            </div>
        </div>

        <!-- Messages -->
        <div id="chatBox">
            <!-- Empty state -->
            <div class="chat-empty" id="emptyState">
                <div class="chat-empty-icon">💬</div>
                <h3>No conversation selected</h3>
                <p>Choose a person from the list to start chatting</p>
            </div>
        </div>

        <!-- Typing indicator -->
        <div class="typing-bubble" id="typingIndicator" style="padding:0 20px 6px;">
            <img class="msg-av" id="typingAvatar" src="https://i.pravatar.cc/40" alt=""/>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Emoji Panel -->
        <div class="emoji-panel" id="emojiPanel">
            <!-- Populated by JS -->
        </div>

        <!-- Input -->
        <div class="input-area" id="inputArea">
            <div class="input-actions">
                <button class="inp-btn" onclick="toggleEmoji()" title="Emoji">😊</button>
                <button class="inp-btn" onclick="document.getElementById('fileInput').click()" title="Attach">📎</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageAttach(this)"/>
            </div>
            <textarea class="input-box" id="messageInput" placeholder="Type a message…" rows="1"
                      oninput="autoResize(this); onTyping();"
                      onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </section>

</div>

<script>
    /* ═══════════════════════════════════════
       STATE
    ═══════════════════════════════════════ */
    let stompClient    = null;
    let selectedUser   = null;
    let selectedUserId = null;
    let allUsers       = [];
    let currentTab     = 'all';
    let typingTimer    = null;
    let isTyping       = false;
    let onlineUsers    = new Set();

    // loggedInUsername from session — fetch on load
    let loggedInUsername = '';
    let myProfilePic     = 'https://i.pravatar.cc/60?img=32';

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    function toast(msg, type = 'success', dur = 3000) {
      const w  = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className   = `toast ${type}`;
      el.textContent = msg;
      w.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, dur);
    }

    /* ═══════════════════════════════════════
       SOCKET — connect
    ═══════════════════════════════════════ */
    function connectSocket() {
      const socket = new SockJS('/ws');
      stompClient  = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({}, function() {
        console.log('✅ Messages socket connected');

        // ── Receive messages (user-specific)
        // API: WebSocket /user/queue/messages
        stompClient.subscribe('/user/queue/messages', function(msg) {
          const data = JSON.parse(msg.body);
          console.log('📩 New message:', data);

          // If from active chat — render immediately
          if (selectedUserId && data.senderId === selectedUserId) {
            appendMessage(data, false);
            scrollToBottom();
            // mark seen
            markSeen(data.senderId);
          } else {
            // toast notification
            toast(`💬 ${data.senderUsername}: ${data.message.slice(0,40)}`, 'info', 4000);
          }
          loadUsers(); // refresh last messages + unread
        });

        // ── Online users broadcast
        // API: WebSocket /topic/online-users
        stompClient.subscribe('/topic/online-users', function(msg) {
          const users = JSON.parse(msg.body);
          onlineUsers = new Set(users);
          updateOnlineDots();
        });
        // ─────────────────────────────
// SEEN EVENT
// API:
// /user/queue/seen
// ─────────────────────────────

stompClient.subscribe(

    '/user/queue/seen',

    function(msg) {

        const data =
            JSON.parse(
                msg.body
            );

        console.log(
            '✅ Seen event:',
            data
        );

        // convert single tick to double tick

        document
            .querySelectorAll(
                '.seen-tick-pending'
            )
            .forEach(tick => {

                tick.innerHTML = '✓✓';

                tick.classList.remove(
                    'seen-tick-pending'
                );

                tick.classList.add(
                    'seen-tick'
                );
            });
    }
);

        // ── Typing indicators (user-specific)
        // API: WebSocket /user/queue/typing
        stompClient.subscribe('/user/queue/typing', function(msg) {
          const data = JSON.parse(msg.body);
          if (data.senderId === selectedUserId) {
            showTyping(data.typing);
          }
        });

      }, function(err) {
        console.warn('Socket error:', err);
        setTimeout(connectSocket, 4000); // auto-reconnect
      });
    }

    /* ═══════════════════════════════════════
       LOAD USERS
       API: GET /user/post/getallUser
       Response: [{id, username, profilePic, online, lastSeen, lastMessage, unreadCount}]
    ═══════════════════════════════════════ */
    async function loadUsers() {
      try {
        const res   = await fetch('/user/post/getallUser', { credentials: 'include' });
        const users = await res.json();
        allUsers    = users;
        renderUsers(filterByTab(users));
      } catch(e) {
        console.error(e);
        // demo fallback
        allUsers = getDemoUsers();
        renderUsers(filterByTab(allUsers));
      }
    }

    function getDemoUsers() {
      return [
        { id:'u1', username:'aryan.dev',  profilePic:'https://i.pravatar.cc/80?img=32', online:true,  lastMessage:'Bhai UI mast bana!',       unreadCount:3,  lastMessageTime: new Date(Date.now()-120000).toISOString() },
        { id:'u2', username:'ui_queen',   profilePic:'https://i.pravatar.cc/80?img=44', online:false, lastMessage:'Thanks for the review 🙏',  unreadCount:0,  lastMessageTime: new Date(Date.now()-3600000).toISOString() },
        { id:'u3', username:'codemaster', profilePic:'https://i.pravatar.cc/80?img=55', online:true,  lastMessage:'Spring Boot ready hai bro', unreadCount:1,  lastMessageTime: new Date(Date.now()-7200000).toISOString() },
        { id:'u4', username:'dev_ninja',  profilePic:'https://i.pravatar.cc/80?img=11', online:false, lastMessage:'Check the PR!',             unreadCount:0,  lastMessageTime: new Date(Date.now()-86400000).toISOString() },
        { id:'u5', username:'pixel.art',  profilePic:'https://i.pravatar.cc/80?img=22', online:true,  lastMessage:'',                          unreadCount:0,  lastMessageTime: null },
      ];
    }

    /* ═══════════════════════════════════════
       RENDER USERS
    ═══════════════════════════════════════ */
    function renderUsers(users) {
      const list = document.getElementById('userList');
      if (!users.length) {
        list.innerHTML = `<div style="color:var(--txt3);font-size:13px;text-align:center;padding:32px 16px;">No conversations found</div>`;
        return;
      }
      list.innerHTML = users.map(u => {
        const isOnline  = onlineUsers.has(u.username) || u.online;
        const isActive  = selectedUserId === u.id;
        const timeStr   = u.lastMessageTime ? relativeTime(u.lastMessageTime) : '';
        const lastMsg   = u.lastMessage || '';
        return `
          <div class="chat-user ${isActive ? 'active' : ''}" data-username="${u.username}" data-id="${u.id}"
               onclick='openChat(${JSON.stringify(u)})'>
            <div class="user-avatar-wrap">
              <img class="user-av" src="${u.profilePic || 'https://i.pravatar.cc/80'}" alt="${u.username}"/>
              <div class="online-ring ${isOnline ? 'show' : ''}"></div>
            </div>
            <div class="user-info">
              <div class="user-name-row">
                <div class="user-name">${u.username}</div>
                <div class="user-time">${timeStr}</div>
              </div>
              <div class="user-last-row">
                <div class="user-last ${u.unreadCount > 0 ? 'unread-msg' : ''}">${lastMsg || '<span style="color:var(--txt3);font-style:italic">No messages yet</span>'}</div>
                ${u.unreadCount > 0 ? `<div class="unread-badge">${u.unreadCount > 99 ? '99+' : u.unreadCount}</div>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function filterByTab(users) {
      if (currentTab === 'unread') return users.filter(u => u.unreadCount > 0);
      if (currentTab === 'online') return users.filter(u => onlineUsers.has(u.username) || u.online);
      return users;
    }

    function setTab(el, tab) {
      document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentTab = tab;
      renderUsers(filterByTab(allUsers));
    }

    function filterUsers(query) {
      const q = query.toLowerCase();
      const filtered = allUsers.filter(u =>
        u.username.toLowerCase().includes(q) ||
        (u.lastMessage || '').toLowerCase().includes(q)
      );
      renderUsers(filterByTab(filtered));
    }

    function updateOnlineDots() {
      document.querySelectorAll('.chat-user').forEach(el => {
        const uname = el.dataset.username;
        const ring  = el.querySelector('.online-ring');
        if (ring) ring.classList.toggle('show', onlineUsers.has(uname));
      });
    }

    /* ═══════════════════════════════════════
       OPEN CHAT
    ═══════════════════════════════════════ */
   async function openChat(user) {

    selectedUser = user;

    selectedUserId = user.id;

    // ─────────────────────────────
    // UPDATE HEADER
    // ─────────────────────────────

    document.getElementById(
        'chatProfilePic'
    ).src =

        user.profilePic
        ||
        'https://i.pravatar.cc/80';

    document.getElementById(
        'chatUsername'
    ).textContent =
        user.username;

    document.getElementById(
        'typingAvatar'
    ).src =

        user.profilePic
        ||
        'https://i.pravatar.cc/40';

    document.getElementById(
        'topbarTitle'
    ).textContent =
        user.username;

    // ─────────────────────────────
    // ONLINE STATUS
    // ─────────────────────────────

    const isOnline =

        onlineUsers.has(
            user.username
        )
        ||
        user.online;

    document.getElementById(
        'chOnline'
    ).classList.toggle(
        'show',
        isOnline
    );

    document.getElementById(
        'chatStatus'
    ).textContent =

        isOnline

        ?

        '🟢 Online'

        :

        user.lastSeen

        ?

        `Last seen ${
            relativeTime(
                user.lastSeen
            )
        }`

        :

        '';

    // ─────────────────────────────
    // MOBILE CHAT OPEN
    // ─────────────────────────────

    document.getElementById(
        'sidebar'
    ).classList.add(
        'slide-out'
    );

    document.getElementById(
        'chatSection'
    ).classList.remove(
        'slide-out'
    );

    // ─────────────────────────────
    // ACTIVE USER HIGHLIGHT
    // ─────────────────────────────

    document
        .querySelectorAll(
            '.chat-user'
        )
        .forEach(el => {

            el.classList.toggle(

                'active',

                el.dataset.id === user.id
            );
        });

    // ─────────────────────────────
    // REMOVE EMPTY STATE
    // ─────────────────────────────

    document.getElementById(
        'emptyState'
    ).style.display = 'none';

    // ─────────────────────────────
    // CLEAR OLD CHAT
    // ─────────────────────────────

    document.getElementById(
        'chatBox'
    ).innerHTML = '';

    // ─────────────────────────────
    // LOAD OLD MESSAGES
    // API:
    // GET /messages/{userId}
    // ─────────────────────────────

    await loadMessages(
        user.id
    );

    // ─────────────────────────────
    // MARK ALL MSG AS SEEN
    // API:
    // PUT /messages/seen/{senderId}
    // ─────────────────────────────

    await markSeen(
        user.id
    );

    // ─────────────────────────────
    // REFRESH USER SIDEBAR
    // unread count update
    // ─────────────────────────────

    await loadUsers();

    // ─────────────────────────────
    // SCROLL CHAT BOTTOM
    // ─────────────────────────────

    scrollToBottom(false);

    console.log(
        "CHAT OPENED FOR = ",
        user.username
    );
}
    function goBackToList() {
      document.getElementById('sidebar').classList.remove('slide-out');
      document.getElementById('chatSection').classList.add('slide-out');
      document.getElementById('topbarTitle').textContent = 'Messages';
    }

    /* ═══════════════════════════════════════
       LOAD MESSAGES
       API: GET /messages/:userId
       Response: [{id, senderId, senderUsername, receiverId, message, createdAt, seen}]
    ═══════════════════════════════════════ */
    async function loadMessages(userId) {
      try {
        const res  = await fetch(`/messages/${userId}`, { credentials: 'include' });
        const msgs = await res.json();

        const box = document.getElementById('chatBox');
        box.innerHTML = '';

        if (!msgs.length) {
          box.innerHTML = `<div style="color:var(--txt3);font-size:13px;text-align:center;padding:32px;">No messages yet. Say hi! 👋</div>`;
          return;
        }

        // Group by date
        let lastDate = null;
        msgs.forEach(m => {
          const msgDate = new Date(m.createdAt).toDateString();
          if (msgDate !== lastDate) {
            box.insertAdjacentHTML('beforeend', `<div class="date-sep">${formatDateLabel(m.createdAt)}</div>`);
            lastDate = msgDate;
          }
          appendMessage(m, false);
        });
        scrollToBottom(false);

      } catch(e) {
        console.warn(e);
        // Demo fallback
        loadDemoMessages();
      }
    }

    function loadDemoMessages() {
      const box  = document.getElementById('chatBox');
      box.innerHTML = `<div class="date-sep">Today</div>`;
      const demos = [
        { senderUsername:'aryan.dev',  message:'Bhai yeh SocialHub project mast chal raha hai!', createdAt: new Date(Date.now()-3600000).toISOString(), seen:true },
        { senderUsername: loggedInUsername || 'me', message:'Haan yaar, UI bhi complete ho gayi ab!', createdAt: new Date(Date.now()-3500000).toISOString(), seen:true },
        { senderUsername:'aryan.dev',  message:'Messages page v ekdm fire lag raha hai 🔥', createdAt: new Date(Date.now()-3400000).toISOString(), seen:true },
        { senderUsername: loggedInUsername || 'me', message:'Thanks bhai! WebSocket bhi kaam kar raha hai ab ✅', createdAt: new Date(Date.now()-60000).toISOString(), seen:false },
      ];
      demos.forEach(m => appendMessage(m, false));
      scrollToBottom(false);
    }

    /* ═══════════════════════════════════════
       APPEND MESSAGE
    ═══════════════════════════════════════ */
    function appendMessage(data, animate = true) {
      const box    = document.getElementById('chatBox');
      const isMine = data.senderUsername === loggedInUsername;
      const time   = data.createdAt ? new Date(data.createdAt).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) : '';
      const pic    = isMine ? myProfilePic : (selectedUser?.profilePic || 'https://i.pravatar.cc/60');

      // Check if same sender as previous (to hide avatar)
      const last   = box.lastElementChild;
      const hidePic = last && last.dataset.sender === (isMine ? 'mine' : 'theirs');

     const tick =

    isMine

    ?

    data.seen

        ?

        '<span class="seen-tick">✓✓</span>'

        :

        '<span class="seen-tick-pending" style="color:var(--txt3)">✓</span>'

    :

    '';

      const msgId = `msg-${Date.now()}-${Math.random().toString(36).slice(2)}`;

      box.insertAdjacentHTML('beforeend', `
        <div class="msg-wrap ${isMine ? 'mine' : ''}" data-sender="${isMine ? 'mine' : 'theirs'}" id="${msgId}"
             style="${animate ? '' : 'animation:none'}">
          <img class="msg-av ${hidePic ? 'hide' : ''}" src="${pic}" alt=""/>
          <div class="bubble-wrap">
            <div class="bubble ${isMine ? 'mine' : 'theirs'}">${escapeHtml(data.message)}</div>
            <div class="msg-meta">${time} ${tick}</div>
          </div>
        </div>`);
    }

    /* ═══════════════════════════════════════
       SEND MESSAGE
       API: WebSocket /app/chat.send
       Payload: { receiverId, message }
    ═══════════════════════════════════════ */
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text  = input.value.trim();
      if (!text || !selectedUserId || !stompClient) return;

      const payload = { receiverId: selectedUserId, message: text };

      stompClient.send('/app/chat.send', {}, JSON.stringify(payload));

      // Optimistic render
      appendMessage({
        senderUsername: loggedInUsername,
        message:        text,
        createdAt:      new Date().toISOString(),
        seen:           false
      }, true);

      input.value = '';
      autoResize(input);
      scrollToBottom();
      loadUsers();
      stopTypingSignal();
    }

    /* ═══════════════════════════════════════
       MARK SEEN
       API: POST /messages/seen/:senderId
    ═══════════════════════════════════════ */
    async function markSeen(senderId) {
      try {
        await fetch(`/messages/seen/${senderId}`, { method:'PUT', credentials:'include' });
      } catch(e) {}
    }

    /* ═══════════════════════════════════════
       TYPING INDICATOR
       API: WebSocket /app/chat.typing
       Payload: { receiverId, typing: true/false }
    ═══════════════════════════════════════ */
    function onTyping() {
      if (!selectedUserId || !stompClient) return;
      if (!isTyping) {
        isTyping = true;
        stompClient.send('/app/chat.typing', {}, JSON.stringify({ receiverId: selectedUserId, typing: true }));
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(stopTypingSignal, 2000);
    }

    function stopTypingSignal() {
      if (!isTyping || !stompClient || !selectedUserId) return;
      isTyping = false;
      stompClient.send('/app/chat.typing', {}, JSON.stringify({ receiverId: selectedUserId, typing: false }));
    }

    function showTyping(show) {
      document.getElementById('typingIndicator').classList.toggle('show', show);
      if (show) scrollToBottom();
    }

    /* ═══════════════════════════════════════
       IMAGE ATTACHMENT (UI only — extend with upload API)
       API: POST /messages/upload  multipart "file"
    ═══════════════════════════════════════ */
    function handleImageAttach(input) {
      const file = input.files[0];
      if (!file || !selectedUserId) return;
      const url = URL.createObjectURL(file);
      const box  = document.getElementById('chatBox');
      box.insertAdjacentHTML('beforeend', `
        <div class="msg-wrap mine">
          <img class="msg-av" src="${myProfilePic}" alt=""/>
          <div class="bubble-wrap">
            <div class="bubble img-bubble mine"><img src="${url}" alt="image"/></div>
            <div class="msg-meta" style="justify-content:flex-end">${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} <span style="color:var(--txt3)">✓</span></div>
          </div>
        </div>`);
      scrollToBottom();
      input.value = '';
      toast('Image shared! (connect upload API to persist)', 'info', 3000);
    }

    /* ═══════════════════════════════════════
       EMOJI PANEL
    ═══════════════════════════════════════ */
    const EMOJIS = ['😊','😂','❤️','🔥','👍','🎉','😍','🙌','💯','😎','🤔','👀','✅','🚀','💪','😢','🥳','🤝','💬','⭐'];
    (function initEmoji() {
      const panel = document.getElementById('emojiPanel');
      EMOJIS.forEach(e => {
        const btn = document.createElement('button');
        btn.className = 'emoji-btn';
        btn.textContent = e;
        btn.onclick = () => {
          const inp = document.getElementById('messageInput');
          inp.value += e;
          inp.focus();
        };
        panel.appendChild(btn);
      });
    })();

    function toggleEmoji() {
      document.getElementById('emojiPanel').classList.toggle('open');
    }

    /* ═══════════════════════════════════════
       HELPERS
    ═══════════════════════════════════════ */
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function scrollToBottom(smooth = true) {
      const box = document.getElementById('chatBox');
      box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/\n/g,'<br/>');
    }

    function relativeTime(ts) {
      const s = Math.floor((Date.now() - new Date(ts)) / 1000);
      if (s < 60)    return 'just now';
      if (s < 3600)  return Math.floor(s/60) + 'm';
      if (s < 86400) return Math.floor(s/3600) + 'h';
      if (s < 604800)return Math.floor(s/86400) + 'd';
      return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    }

    function formatDateLabel(ts) {
      const d    = new Date(ts);
      const now  = new Date();
      const diff = Math.floor((now - d) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    }

    /* ═══════════════════════════════════════
       INIT — fetch logged-in user info
       API: GET /user/post/profile/me
    ═══════════════════════════════════════ */
    async function fetchMyProfile() {
      try {
        const res  = await fetch('/user/post/profile/me', { credentials:'include' });
        const data = await res.json();
        loggedInUsername = data.username || '';
        myProfilePic     = data.profilePic || myProfilePic;
        document.getElementById('chatBox').querySelector && '';
      } catch(e) {
        // fallback — try localStorage
        loggedInUsername = localStorage.getItem('username') || '';
      }
    }

    window.addEventListener('load', async function() {
      await fetchMyProfile();
      connectSocket();
      loadUsers();
    });
</script>
</body>
</html>
