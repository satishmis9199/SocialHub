<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SocialHub — Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:      #07070f;
          --surf:    #0f0f1c;
          --surf2:   #161625;
          --surf3:   #1e1e30;
          --surf4:   #26263a;
          --border:  rgba(255,255,255,0.07);
          --border2: rgba(255,255,255,0.14);
          --accent:  #7c6af7;
          --accent2: #f76ab4;
          --accent3: #43e8c8;
          --grad:    linear-gradient(135deg,#7c6af7,#f76ab4);
          --txt:     #eeeeff;
          --txt2:    #8888b0;
          --txt3:    #4a4a70;
          --green:   #3ecf6e;
          --font-h:  'Syne', sans-serif;
          --font-b:  'DM Sans', sans-serif;
          --nav-h:   60px;
          --foot-h:  46px;
          --sidebar: 310px;
        }

        html, body { height: 100%; overflow: hidden; }
        body {
          font-family: var(--font-b);
          background: var(--bg);
          color: var(--txt);
          display: flex; flex-direction: column;
        }

        body::before {
          content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
          background:
            radial-gradient(ellipse 55% 45% at 15% 10%, rgba(124,106,247,0.10) 0%, transparent 65%),
            radial-gradient(ellipse 45% 40% at 88% 90%, rgba(247,106,180,0.08) 0%, transparent 65%);
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--surf4); border-radius: 99px; }

        /* ════════════════════════
           HEADER
        ════════════════════════ */
        .navbar {
          position: relative; z-index: 10;
          height: var(--nav-h); flex-shrink: 0;
          background: rgba(7,7,15,0.94);
          backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center;
          padding: 0 20px; gap: 14px;
        }
        .back-btn {
          display: none;
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 50%; width: 34px; height: 34px;
          align-items: center; justify-content: center;
          color: var(--txt2); font-size: 18px; cursor: pointer;
          transition: all .2s; flex-shrink: 0;
        }
        .back-btn:hover { color: var(--txt); border-color: var(--border2); }
        .nav-logo {
          font-family: var(--font-h); font-size: 20px; font-weight: 800;
          background: var(--grad);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          cursor: pointer; flex-shrink: 0;
        }
        .nav-chat-title {
          font-family: var(--font-h); font-size: 15px; font-weight: 700;
          color: var(--txt); display: none; flex: 1; min-width: 0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-search {
          flex: 1; max-width: 260px; margin-left: 8px;
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 99px; display: flex; align-items: center;
          padding: 0 13px; gap: 8px; transition: border-color .2s;
        }
        .nav-search:focus-within { border-color: rgba(124,106,247,0.45); }
        .nav-search input {
          background: none; border: none; outline: none;
          color: var(--txt); font-family: var(--font-b); font-size: 13px;
          padding: 8px 0; width: 100%;
        }
        .nav-search input::placeholder { color: var(--txt3); }
        .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .nav-btn {
          width: 34px; height: 34px; border-radius: 50%;
          background: var(--surf2); border: 1px solid var(--border);
          color: var(--txt2); font-size: 15px; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all .2s; text-decoration: none;
        }
        .nav-btn:hover { background: var(--surf3); color: var(--txt); border-color: var(--border2); }

        /* ════════════════════════
           LAYOUT
        ════════════════════════ */
        .main {
          display: flex; flex: 1; overflow: hidden;
          position: relative; z-index: 1;
        }

        /* ════════════════════════
           SIDEBAR
        ════════════════════════ */
        .sidebar {
          width: var(--sidebar); flex-shrink: 0;
          background: var(--surf);
          border-right: 1px solid var(--border);
          display: flex; flex-direction: column;
          overflow: hidden;
          transition: transform .3s cubic-bezier(.4,0,.2,1);
        }
        .sidebar-top {
          padding: 14px 14px 10px;
          border-bottom: 1px solid var(--border);
        }
        .sidebar-heading {
          font-family: var(--font-h); font-size: 17px; font-weight: 800;
          color: var(--txt); margin-bottom: 11px;
          display: flex; align-items: center; justify-content: space-between;
        }
        .new-chat-btn {
          background: var(--grad); border: none; border-radius: 50%;
          width: 26px; height: 26px; color: #fff; font-size: 18px;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; transition: opacity .2s; flex-shrink: 0; line-height: 1;
        }
        .new-chat-btn:hover { opacity: .82; }
        .search-bar {
          background: var(--surf2); border: 1px solid var(--border);
          border-radius: 10px; display: flex; align-items: center;
          padding: 0 10px; gap: 7px; transition: border-color .2s;
        }
        .search-bar:focus-within { border-color: rgba(124,106,247,0.4); }
        .search-bar input {
          background: none; border: none; outline: none;
          color: var(--txt); font-family: var(--font-b); font-size: 13px;
          padding: 8px 0; width: 100%;
        }
        .search-bar input::placeholder { color: var(--txt3); }

        .sidebar-tabs {
          display: flex; gap: 4px;
          padding: 10px 14px 0;
          border-bottom: 1px solid var(--border);
        }
        .s-tab {
          flex: 1; text-align: center; padding: 7px 0;
          font-size: 11px; font-weight: 600; cursor: pointer;
          color: var(--txt3); border-radius: 8px; transition: all .2s;
          text-transform: uppercase; letter-spacing: 0.6px;
        }
        .s-tab.active { background: rgba(124,106,247,0.15); color: var(--accent); }
        .s-tab:hover:not(.active) { color: var(--txt2); }

        .user-list { flex: 1; overflow-y: auto; padding: 6px 0; }

        .chat-user {
          display: flex; align-items: center; gap: 11px;
          padding: 10px 14px; cursor: pointer;
          transition: background .15s; position: relative;
          border-left: 3px solid transparent;
        }
        .chat-user:hover { background: var(--surf2); }
        .chat-user.active {
          background: rgba(124,106,247,0.08);
          border-left-color: var(--accent);
        }
        .av-wrap { position: relative; flex-shrink: 0; }
        .av {
          width: 46px; height: 46px; border-radius: 50%;
          object-fit: cover; display: block;
          border: 2px solid var(--surf3); transition: border-color .2s;
        }
        .chat-user.active .av { border-color: rgba(124,106,247,0.4); }
        .online-ring {
          position: absolute; bottom: 1px; right: 1px;
          width: 12px; height: 12px; border-radius: 50%;
          background: var(--green); border: 2px solid var(--surf); display: none;
        }
        .online-ring.on { display: block; }
        .user-info { flex: 1; min-width: 0; }
        .row1 { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
        .u-name {
          font-size: 13.5px; font-weight: 600; color: var(--txt);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .u-time { font-size: 11px; color: var(--txt3); flex-shrink: 0; }
        .row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 3px; }
        .u-last {
          font-size: 12.5px; color: var(--txt2);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;
        }
        .u-last.bold { color: var(--txt); font-weight: 500; }
        .unread-badge {
          background: var(--accent); color: #fff;
          font-size: 10px; font-weight: 700;
          min-width: 18px; height: 18px; border-radius: 99px;
          display: flex; align-items: center; justify-content: center;
          padding: 0 5px; flex-shrink: 0;
        }

        /* skeleton */
        .skel-wrap { display: flex; align-items: center; gap: 11px; padding: 10px 14px; }
        .sk { background: var(--surf2); position: relative; overflow: hidden; border-radius: 6px; }
        .sk::after {
          content: ''; position: absolute; inset: 0;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
          background-size: 300% 100%; animation: sk 1.4s infinite;
        }
        @keyframes sk { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
        .sk-c { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
        .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .sk-l { height: 11px; border-radius: 5px; }

        /* ════════════════════════
           CHAT PANEL
        ════════════════════════ */
        .chat-panel {
          flex: 1; display: flex; flex-direction: column;
          overflow: hidden; background: var(--bg);
          transition: transform .3s cubic-bezier(.4,0,.2,1);
        }
        .chat-head {
          display: flex; align-items: center; gap: 11px;
          padding: 11px 18px;
          background: var(--surf);
          border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .ch-av-wrap { position: relative; flex-shrink: 0; }
        .ch-av {
          width: 42px; height: 42px; border-radius: 50%;
          object-fit: cover; display: block; border: 2px solid var(--surf3);
        }
        .ch-online-dot {
          position: absolute; bottom: 1px; right: 1px;
          width: 11px; height: 11px; border-radius: 50%;
          background: var(--green); border: 2px solid var(--surf); display: none;
        }
        .ch-online-dot.on { display: block; }
        .ch-info { flex: 1; min-width: 0; }
        .ch-name {
          font-family: var(--font-h); font-size: 15px; font-weight: 700; color: var(--txt);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ch-status { font-size: 12px; color: var(--txt2); margin-top: 1px; }
        .ch-actions { display: flex; gap: 6px; }
        .ch-btn {
          width: 34px; height: 34px; border-radius: 50%;
          background: var(--surf2); border: 1px solid var(--border);
          color: var(--txt2); font-size: 15px; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all .2s;
        }
        .ch-btn:hover { background: var(--surf3); color: var(--txt); }

        /* empty state */
        .empty-state {
          flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 12px;
        }
        .empty-icon { font-size: 58px; opacity: .25; }
        .empty-state h3 { font-family: var(--font-h); font-size: 18px; color: var(--txt2); }
        .empty-state p { font-size: 13px; color: var(--txt3); text-align: center; max-width: 230px; line-height: 1.65; }

        /* messages box */
        #chatBox {
          flex: 1; overflow-y: auto; padding: 16px 18px;
          display: flex; flex-direction: column; gap: 3px;
        }

        /* date separator */
        .date-sep {
          display: flex; align-items: center; gap: 10px;
          margin: 10px 0; color: var(--txt3); font-size: 10px;
          text-transform: uppercase; letter-spacing: 0.9px;
        }
        .date-sep::before, .date-sep::after {
          content: ''; flex: 1; height: 1px;
          background: linear-gradient(to right, transparent, var(--border), transparent);
        }

        /* message bubble */
        .msg-wrap {
          display: flex; gap: 8px; align-items: flex-end;
          animation: msgIn .22s ease both;
        }
        @keyframes msgIn {
          from { opacity: 0; transform: translateY(7px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .msg-wrap.mine { flex-direction: row-reverse; }
        .msg-av {
          width: 28px; height: 28px; border-radius: 50%;
          object-fit: cover; flex-shrink: 0; margin-bottom: 2px;
        }
        .msg-av.hide { visibility: hidden; }
        .bubble-wrap { display: flex; flex-direction: column; max-width: 64%; }
        .msg-wrap.mine .bubble-wrap { align-items: flex-end; }
        .bubble {
          padding: 9px 13px; border-radius: 18px;
          font-size: 14px; line-height: 1.55; color: var(--txt);
          word-break: break-word;
        }
        .bubble.theirs {
          background: var(--surf2); border: 1px solid var(--border);
          border-bottom-left-radius: 4px;
        }
        .bubble.mine {
          background: var(--accent); color: #fff;
          border-bottom-right-radius: 4px;
        }
        .bubble.img-bubble {
          padding: 4px; background: var(--surf2); border: 1px solid var(--border);
        }
        .bubble.img-bubble img { width: 190px; border-radius: 13px; display: block; }
        .bubble.img-bubble.mine { background: rgba(124,106,247,0.5); border-color: transparent; }

        .msg-meta {
          display: flex; align-items: center; gap: 4px;
          font-size: 11px; color: var(--txt3); margin-top: 3px; padding: 0 4px;
        }
        .msg-wrap.mine .msg-meta { justify-content: flex-end; }

        /* ticks */
        .seen-tick         { color: #8be28b; font-size: 13px; font-weight: 700; }
        .seen-tick-pending { color: var(--txt3); font-size: 13px; }

        /* typing indicator */
        .typing-wrap {
          display: none; align-items: center; gap: 8px;
          padding: 4px 18px 8px;
        }
        .typing-wrap.show { display: flex; }
        .t-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .typing-dots {
          display: flex; gap: 4px;
          background: var(--surf2); border: 1px solid var(--border);
          padding: 9px 13px; border-radius: 18px; border-bottom-left-radius: 4px;
        }
        .typing-dots span {
          width: 6px; height: 6px; border-radius: 50%; background: var(--txt3);
          animation: tdot 1.2s ease infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: .18s; }
        .typing-dots span:nth-child(3) { animation-delay: .36s; }
        @keyframes tdot {
          0%,60%,100% { transform: translateY(0); }
          30% { transform: translateY(-6px); background: var(--accent); }
        }

        /* emoji panel */
        .emoji-panel {
          display: flex; flex-wrap: wrap; gap: 3px;
          padding: 0 16px; max-height: 0; overflow: hidden;
          background: var(--surf2);
          transition: max-height .28s ease, padding .28s, border-width .28s;
          border-top: 0px solid var(--border);
        }
        .emoji-panel.open {
          max-height: 110px; padding: 10px 16px;
          border-top: 1px solid var(--border);
        }
        .e-btn {
          background: none; border: none; font-size: 21px;
          cursor: pointer; border-radius: 8px; padding: 4px 5px; transition: background .15s;
        }
        .e-btn:hover { background: var(--surf3); }

        /* input area */
        .input-area {
          padding: 10px 14px;
          background: var(--surf);
          border-top: 1px solid var(--border);
          display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
        }
        .inp-actions { display: flex; gap: 4px; align-items: center; }
        .inp-btn {
          background: none; border: none; color: var(--txt3);
          font-size: 18px; cursor: pointer; padding: 6px;
          border-radius: 8px; transition: all .2s;
          display: flex; align-items: center; justify-content: center;
        }
        .inp-btn:hover { color: var(--accent); background: rgba(124,106,247,0.1); }
        .input-box {
          flex: 1; background: var(--surf2); border: 1px solid var(--border);
          border-radius: 22px; padding: 9px 15px;
          color: var(--txt); font-family: var(--font-b); font-size: 14px;
          outline: none; resize: none; max-height: 120px; line-height: 1.5;
          transition: border-color .2s; overflow-y: auto;
        }
        .input-box:focus { border-color: rgba(124,106,247,0.45); }
        .input-box::placeholder { color: var(--txt3); }
        .send-btn {
          width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
          background: var(--grad); border: none; color: #fff;
          font-size: 16px; cursor: pointer; display: flex;
          align-items: center; justify-content: center;
          transition: all .2s; box-shadow: 0 4px 14px rgba(124,106,247,0.35);
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 22px rgba(124,106,247,0.5); }
        .send-btn:active { transform: scale(0.94); }

        /* ════════════════════════
           FOOTER
        ════════════════════════ */
        .footer {
          position: relative; z-index: 10;
          height: var(--foot-h); flex-shrink: 0;
          background: rgba(7,7,15,0.96);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border-top: 1px solid var(--border);
          display: flex; align-items: center; justify-content: center;
          padding: 0 20px; gap: 8px;
        }
        .foot-text  { font-size: 12px; color: var(--txt3); }
        .foot-brand {
          font-family: var(--font-h); font-size: 12px; font-weight: 700;
          background: var(--grad);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .foot-sep   { color: var(--txt3); font-size: 10px; margin: 0 4px; }
        .foot-links { display: flex; gap: 14px; margin-left: 6px; }
        .foot-link  {
          font-size: 11px; color: var(--txt3); cursor: pointer;
          text-decoration: none; transition: color .2s;
        }
        .foot-link:hover { color: var(--accent); }

        /* ════════════════════════
           TOAST
        ════════════════════════ */
        #toastWrap {
          position: fixed;
          bottom: calc(var(--foot-h) + 14px);
          left: 50%; transform: translateX(-50%);
          z-index: 9999;
          display: flex; flex-direction: column; align-items: center; gap: 7px;
          pointer-events: none;
        }
        .toast {
          padding: 9px 20px; border-radius: 99px; font-size: 13px; font-weight: 500;
          opacity: 0; transform: translateY(10px) scale(.96);
          transition: all .3s cubic-bezier(.34,1.4,.64,1);
          border: 1px solid; white-space: nowrap; backdrop-filter: blur(14px);
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
        .toast.success { background: rgba(20,45,28,.9); border-color: rgba(62,207,110,.3); color: #6ee0a0; }
        .toast.error   { background: rgba(48,14,14,.9);  border-color: rgba(248,113,113,.3); color: #f08080; }
        .toast.info    { background: rgba(14,24,50,.9);  border-color: rgba(124,106,247,.3); color: #a09af7; }
        .toast.warn    { background: rgba(48,34,10,.9);  border-color: rgba(251,191,36,.3);  color: #fcd34d; }

        /* ════════════════════════
           RESPONSIVE
        ════════════════════════ */
        @media (max-width: 680px) {
          :root { --sidebar: 100%; }
          .sidebar {
            position: absolute; inset: 0;
            top: var(--nav-h); bottom: var(--foot-h); z-index: 5;
          }
          .sidebar.slide-out { transform: translateX(-100%); }
          .chat-panel {
            position: absolute; inset: 0;
            top: var(--nav-h); bottom: var(--foot-h);
          }
          .chat-panel.slide-out { transform: translateX(100%); }
          .back-btn { display: flex; }
          .nav-logo { display: none; }
          .nav-chat-title { display: block; }
          .nav-search { display: none; }
          .bubble-wrap { max-width: 80%; }
          #chatBox { padding: 12px 12px; }
          .input-area { padding: 8px 10px; }
          .foot-links { display: none; }
        }
    </style>
</head>
<body>

<div id="toastWrap"></div>

<!-- ════════════════════════
     HEADER
════════════════════════ -->
<header class="navbar">
    <button class="back-btn" id="backBtn" onclick="goBackToList()">←</button>
    <div class="nav-logo" onclick="location.href='/user/dashboard'">SocialHub</div>
    <div class="nav-chat-title" id="navChatTitle">Messages</div>
    <div class="nav-search">
        <span style="color:var(--txt3);font-size:14px;">🔍</span>
        <input type="text" placeholder="Search conversations…" oninput="filterUsers(this.value)"/>
    </div>
    <div class="nav-right">
        <a class="nav-btn" href="/user/dashboard" title="Home">🏠</a>
        <a class="nav-btn" href="/user/dashboard" title="Notifications">🔔</a>
        <a class="nav-btn" href="/user/myProfile" title="My Profile">👤</a>
    </div>
</header>

<!-- ════════════════════════
     MAIN
════════════════════════ -->
<div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-heading">
                Messages
                <button class="new-chat-btn" onclick="toast('Group chat coming soon 🚀','info')" title="New Chat">＋</button>
            </div>
            <div class="search-bar">
                <span style="color:var(--txt3);font-size:14px;">🔍</span>
                <input type="text" placeholder="Search people…" id="sideSearch" oninput="filterUsers(this.value)"/>
            </div>
        </div>

        <div class="sidebar-tabs">
            <div class="s-tab active" onclick="setTab(this,'all')">All</div>
            <div class="s-tab" onclick="setTab(this,'unread')">Unread</div>
            <div class="s-tab" onclick="setTab(this,'online')">Online</div>
        </div>

        <div class="user-list" id="userList">
            <div class="skel-wrap"><div class="sk sk-c"></div><div class="sk-lines"><div class="sk sk-l" style="width:48%"></div><div class="sk sk-l" style="width:70%"></div></div></div>
            <div class="skel-wrap"><div class="sk sk-c"></div><div class="sk-lines"><div class="sk sk-l" style="width:36%"></div><div class="sk sk-l" style="width:58%"></div></div></div>
            <div class="skel-wrap"><div class="sk sk-c"></div><div class="sk-lines"><div class="sk sk-l" style="width:54%"></div><div class="sk sk-l" style="width:42%"></div></div></div>
            <div class="skel-wrap"><div class="sk sk-c"></div><div class="sk-lines"><div class="sk sk-l" style="width:40%"></div><div class="sk sk-l" style="width:64%"></div></div></div>
        </div>
    </aside>

    <!-- CHAT PANEL -->
    <section class="chat-panel slide-out" id="chatPanel">

        <div class="chat-head">
            <div class="ch-av-wrap"
                 onclick="openUserProfile()"
                 style="cursor:pointer">
                <img class="ch-av" id="chatPic" src="https://i.pravatar.cc/80" alt=""/>
                <div class="ch-online-dot" id="chDot"></div>
            </div>
            <div class="ch-info">
                <div class="ch-name"
                     id="chatName"
                     onclick="openUserProfile()"
                     style="cursor:pointer">Select a conversation</div>
                <div class="ch-status" id="chatStatus">—</div>
            </div>
            <div class="ch-actions">
                <button class="ch-btn" onclick="toast('Voice call coming soon 📞','info')">📞</button>
                <button class="ch-btn" onclick="toast('Video call coming soon 📹','info')">📹</button>
                <button class="ch-btn" onclick="toast('More options soon','info')">⋯</button>
            </div>
        </div>

        <div id="chatBox">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>No chat open</h3>
                <p>Pick someone from the list and start a conversation!</p>
            </div>
        </div>

        <div class="typing-wrap" id="typingWrap">
            <img class="t-av" id="typingAv" src="https://i.pravatar.cc/40" alt=""/>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>

        <div class="emoji-panel" id="emojiPanel"></div>

        <div class="input-area">
            <div class="inp-actions">
                <button class="inp-btn" onclick="toggleEmoji()" title="Emoji">😊</button>
                <button class="inp-btn" onclick="document.getElementById('imgInput').click()" title="Attach Image">📎</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageAttach(this)"/>
            </div>
            <textarea class="input-box" id="messageInput" placeholder="Type a message…" rows="1"
                      oninput="autoResize(this); onTyping();"
                      onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>

    </section>
</div>

<!-- ════════════════════════
     FOOTER — Satish Kumar Mishra
════════════════════════ -->
<footer class="footer">
    <span class="foot-text">Crafted with ❤️ by</span>
    <span class="foot-brand">Satish Kumar Mishra</span>
    <span class="foot-sep">·</span>
    <span class="foot-text">SocialHub © 2025</span>
    <div class="foot-links">
        <a class="foot-link" href="/user/dashboard">Dashboard</a>
        <a class="foot-link" href="/user/myProfile">Profile</a>
        <a class="foot-link" href="#">Privacy</a>
        <a class="foot-link" href="#">Terms</a>
    </div>
</footer>

<script>
    /* ════════════════════════
       STATE
    ════════════════════════ */
    let stompClient      = null;
    let selectedUser     = null;
    let selectedUserId   = null;
    let allUsers         = [];
    let currentTab       = 'all';
    let typingTimer      = null;
    let isTyping         = false;
    let onlineUsers      = new Set();
    let loggedInUsername = '';
    let myProfilePic     = 'https://i.pravatar.cc/60?img=1';

    /* ════════════════════════
       TOAST
    ════════════════════════ */
    function toast(msg, type = 'success', dur = 3000) {
      const w  = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className   = `toast ${type}`;
      el.textContent = msg;
      w.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, dur);
    }

    /* ════════════════════════
       WEBSOCKET
    ════════════════════════ */
    function connectSocket() {
      const socket = new SockJS('/ws');
      stompClient  = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({}, function() {
        console.log('✅ WS connected');

        /*
         * API: WebSocket /user/queue/messages
         * Receive: { senderId, senderUsername, message, createdAt, seen }
         * Fires when someone sends you a message
         */
        stompClient.subscribe('/user/queue/messages', function(msg) {
          const data = JSON.parse(msg.body);
          console.log('📩 New message:', data);

          if (selectedUserId && data.senderId === selectedUserId) {
            appendMessage(data, true);
            scrollToBottom();
            /* Chat is open — backend marks seen automatically */
          } else {
            toast(`💬 ${data.senderUsername}: ${(data.message || '').slice(0, 40)}`, 'info', 5000);
          }
          loadUsers();
        });

        /*
         * API: WebSocket /topic/online-users
         * Receive: string[] — list of currently online usernames
         * Fires when any user connects or disconnects
         */
        stompClient.subscribe('/topic/online-users', function(msg) {
          onlineUsers = new Set(JSON.parse(msg.body));
          updateOnlineDots();
        });

        /*
         * API: WebSocket /user/queue/typing
         * Receive: { senderId, typing: boolean }
         * Fires when the other person starts or stops typing
         */
        stompClient.subscribe('/user/queue/typing', function(msg) {
          const data = JSON.parse(msg.body);
          if (data.senderId === selectedUserId) {
            showTyping(data.typing);
          }
        });

        /*
         * API: WebSocket /user/queue/seen
         * Receive: any object — triggered when receiver reads your message
         * Converts single tick ✓ to double tick ✓✓
         */
        stompClient.subscribe('/user/queue/seen', function(msg) {
          console.log('✅ Seen event:', JSON.parse(msg.body));
          document.querySelectorAll('.seen-tick-pending').forEach(tick => {
            tick.innerHTML = '✓✓';
            tick.classList.remove('seen-tick-pending');
            tick.classList.add('seen-tick');
          });
        });

      }, function(err) {
        console.warn('WS error, reconnecting…', err);
        setTimeout(connectSocket, 4000);
      });
    }

    /* ════════════════════════
       LOAD USERS
       API: GET /user/post/getallUser
       Response: UserMessageResponse[]
       Fields: id(UUID), username, profilePic, online(boolean),
               lastSeen(LocalDateTime), lastMessage(String), unreadCount(int)
    ════════════════════════ */
    async function loadUsers() {
      try {
        const res = await fetch('/user/post/getallUser', { credentials: 'include' });
        if (!res.ok) throw new Error('failed');
        allUsers = await res.json();
        renderUsers(filterByTab(allUsers));
      } catch(e) {
        console.warn('loadUsers fallback:', e);
        allUsers = [
          { id:'u1', username:'aryan.dev',   profilePic:'https://i.pravatar.cc/80?img=32', online:true,  lastSeen:null,                  lastMessage:'Bhai UI ekdm fire hai 🔥', unreadCount:3 },
          { id:'u2', username:'ui_queen',    profilePic:'https://i.pravatar.cc/80?img=44', online:false, lastSeen:'2025-05-10T09:30:00', lastMessage:'Thanks bhai 🙏',           unreadCount:0 },
          { id:'u3', username:'codemaster',  profilePic:'https://i.pravatar.cc/80?img=55', online:true,  lastSeen:null,                  lastMessage:'Spring Boot ready hai',     unreadCount:1 },
          { id:'u4', username:'dev_ninja',   profilePic:'https://i.pravatar.cc/80?img=11', online:false, lastSeen:'2025-05-09T18:00:00', lastMessage:'Check the PR!',            unreadCount:0 },
          { id:'u5', username:'pixel.craft', profilePic:'https://i.pravatar.cc/80?img=22', online:false, lastSeen:null,                  lastMessage:'',                         unreadCount:0 },
        ];
        renderUsers(filterByTab(allUsers));
      }
    }

    /* ════════════════════════
       RENDER USERS
    ════════════════════════ */
    function renderUsers(users) {
      const list = document.getElementById('userList');
      if (!users.length) {
        list.innerHTML = `<div style="color:var(--txt3);font-size:13px;text-align:center;padding:30px 16px;">No conversations found</div>`;
        return;
      }
      list.innerHTML = users.map(u => {
        const isOnline  = onlineUsers.has(u.username) || u.online;
        const isActive  = selectedUserId === u.id;
        const lsDate    = u.lastSeen ? parseJavaDateTime(u.lastSeen) : null;
        const timeStr   = lsDate ? relativeTime(lsDate) : '';
        const lastMsg   = u.lastMessage || '';
        return `
        <div class="chat-user ${isActive ? 'active' : ''}"
             data-username="${u.username}" data-id="${u.id}"
             onclick='openChat(${JSON.stringify(u)})'>
          <div class="av-wrap">
            <img class="av" src="${u.profilePic || 'https://i.pravatar.cc/80'}" alt="${u.username}"
                 onerror="this.src='https://i.pravatar.cc/80'"/>
            <div class="online-ring ${isOnline ? 'on' : ''}"></div>
          </div>
          <div class="user-info">
            <div class="row1">
              <div class="u-name">${escapeHtml(u.username)}</div>
              <div class="u-time">${timeStr}</div>
            </div>
            <div class="row2">
              <div class="u-last ${u.unreadCount > 0 ? 'bold' : ''}">
                ${lastMsg ? escapeHtml(lastMsg) : '<em style="color:var(--txt3);font-style:italic">No messages yet</em>'}
              </div>
              ${u.unreadCount > 0 ? `<div class="unread-badge">${u.unreadCount > 99 ? '99+' : u.unreadCount}</div>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function filterByTab(users) {
      if (currentTab === 'unread') return users.filter(u => u.unreadCount > 0);
      if (currentTab === 'online') return users.filter(u => onlineUsers.has(u.username) || u.online);
      return users;
    }

    function setTab(el, tab) {
      document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentTab = tab;
      renderUsers(filterByTab(allUsers));
    }

    function filterUsers(query) {
      const q = query.toLowerCase();
      const filtered = allUsers.filter(u =>
        u.username.toLowerCase().includes(q) ||
        (u.lastMessage || '').toLowerCase().includes(q)
      );
      renderUsers(filterByTab(filtered));
    }

    function updateOnlineDots() {
      document.querySelectorAll('.chat-user').forEach(el => {
        const uname = el.dataset.username;
        const ring  = el.querySelector('.online-ring');
        if (ring) ring.classList.toggle('on', onlineUsers.has(uname));
      });
      if (selectedUser) {
        const on = onlineUsers.has(selectedUser.username) || selectedUser.online;
        document.getElementById('chDot').classList.toggle('on', on);
      }
    }

    /* ════════════════════════
       OPEN CHAT
    ════════════════════════ */
    async function openChat(user) {
      selectedUser   = user;
      selectedUserId = user.id;

      /* Update header */
      document.getElementById('chatPic').src              = user.profilePic || 'https://i.pravatar.cc/80';
      document.getElementById('chatName').textContent      = user.username;
      document.getElementById('navChatTitle').textContent  = user.username;
      document.getElementById('typingAv').src             = user.profilePic || 'https://i.pravatar.cc/40';

      const isOnline = onlineUsers.has(user.username) || user.online;
      document.getElementById('chDot').classList.toggle('on', isOnline);

      /* lastSeen — Java LocalDateTime: array [y,mo,d,h,m,s] or ISO string */
      if (isOnline) {
        document.getElementById('chatStatus').textContent = '🟢 Online';
      } else if (user.lastSeen) {
        const ls = parseJavaDateTime(user.lastSeen);
        document.getElementById('chatStatus').textContent = ls ? `Last seen ${relativeTime(ls)}` : '';
      } else {
        document.getElementById('chatStatus').textContent = '';
      }

      /* Mobile — show chat panel */
      document.getElementById('sidebar').classList.add('slide-out');
      document.getElementById('chatPanel').classList.remove('slide-out');

      /* Mark active in list */
      document.querySelectorAll('.chat-user').forEach(el =>
        el.classList.toggle('active', el.dataset.id === user.id));

      /* Clear old messages */
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('chatBox').innerHTML = '';

      /*
       * API: GET /messages/{userId}
       * Loads full message history with this user
       * Backend also marks all their messages as SEEN (read) on this call
       */
      await loadMessages(user.id);

      /*
       * API: PUT /messages/seen/{senderId}
       * Marks all messages from this sender as read
       * Backend triggers /user/queue/seen to sender → their ✓ becomes ✓✓
       */
      await markSeen(user.id);

      /* Refresh sidebar to update unread counts */
      await loadUsers();

      scrollToBottom(false);
      console.log('Chat opened for:', user.username);
    }

    function goBackToList() {
      document.getElementById('sidebar').classList.remove('slide-out');
      document.getElementById('chatPanel').classList.add('slide-out');
      document.getElementById('navChatTitle').textContent = 'Messages';
    }
    function openUserProfile() {

    if (!selectedUserId) {
        toast('No user selected', 'warn');
        return;
    }

    window.location.href =
        `/user/profile/${selectedUserId}`;
}

function openProfileByMessage(senderId) {

    if (!senderId) {
        toast('Profile not available', 'warn');
        return;
    }

    window.location.href =
        `/user/profile/${senderId}`;
}

    /* ════════════════════════
       LOAD MESSAGES
       API: GET /messages/{userId}
       Response: [{ id, senderId, senderUsername, receiverId, message, createdAt, seen }]
    ════════════════════════ */
    async function loadMessages(userId) {
      try {
        const res  = await fetch(`/messages/${userId}`, { credentials: 'include' });
        if (!res.ok) throw new Error('failed');
        const msgs = await res.json();
        const box  = document.getElementById('chatBox');
        box.innerHTML = '';

        if (!msgs.length) {
          box.innerHTML = `<div style="color:var(--txt3);font-size:13px;text-align:center;padding:32px;">No messages yet. Say hi! 👋</div>`;
          return;
        }

        let lastDate = null;
        msgs.forEach(m => {
          const msgDate = new Date(m.createdAt).toDateString();
          if (msgDate !== lastDate) {
            box.insertAdjacentHTML('beforeend', `<div class="date-sep">${formatDateLabel(m.createdAt)}</div>`);
            lastDate = msgDate;
          }
          appendMessage(m, false);
        });
        scrollToBottom(false);

      } catch(e) {
        console.warn('loadMessages demo fallback:', e);
        loadDemoMessages();
      }
    }

    function loadDemoMessages() {
      const box = document.getElementById('chatBox');
      box.innerHTML = `<div class="date-sep">Today</div>`;
      [
        { senderUsername: selectedUser?.username || 'user', message: 'Bhai SocialHub ka UI ekdm mast bana hai! 🔥', createdAt: new Date(Date.now()-3600000).toISOString(), seen: true  },
        { senderUsername: loggedInUsername || 'me',          message: 'Haan yaar, sab smooth chal raha hai ✅',       createdAt: new Date(Date.now()-3500000).toISOString(), seen: true  },
        { senderUsername: selectedUser?.username || 'user', message: 'Messages page v zabardast 💯',                 createdAt: new Date(Date.now()-3400000).toISOString(), seen: true  },
        { senderUsername: loggedInUsername || 'me',          message: 'Satish ne banaya hai bhai 😎🚀',               createdAt: new Date(Date.now()-60000).toISOString(),   seen: false },
      ].forEach(m => appendMessage(m, false));
      scrollToBottom(false);
    }

    /* ════════════════════════
       MARK SEEN
       API: PUT /messages/seen/{senderId}
       Called when chat is opened
       Backend then fires /user/queue/seen to sender → ✓ becomes ✓✓
    ════════════════════════ */
    async function markSeen(senderId) {
      try {
        await fetch(`/messages/seen/${senderId}`, {
          method: 'PUT',
          credentials: 'include'
        });
      } catch(e) {
        console.warn('markSeen failed:', e);
      }
    }

    /* ════════════════════════
       APPEND MESSAGE BUBBLE
    ════════════════════════ */
    function appendMessage(data, animate = true) {
      const box     = document.getElementById('chatBox');
      const isMine  = data.senderUsername === loggedInUsername;
      const time    = data.createdAt
        ? new Date(data.createdAt).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
        : new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      const pic = isMine
        ? myProfilePic
        : (selectedUser?.profilePic || 'https://i.pravatar.cc/60');

      const last    = box.lastElementChild;
      const hidePic = last && last.dataset.sender === (isMine ? 'mine' : 'theirs');

      const tick = isMine
        ? data.seen
          ? `<span class="seen-tick">✓✓</span>`
          : `<span class="seen-tick-pending">✓</span>`
        : '';

      box.insertAdjacentHTML('beforeend', `
        <div class="msg-wrap ${isMine ? 'mine' : ''}" data-sender="${isMine ? 'mine' : 'theirs'}"
             style="${animate ? '' : 'animation:none'}">
          <img class="msg-av ${hidePic ? 'hide' : ''}"
     src="${pic}"
     alt=""
     style="cursor:pointer"
     onclick="openProfileByMessage('${isMine ? selectedUserId : data.senderId}')"
               onerror="this.src='https://i.pravatar.cc/60'"/>
          <div class="bubble-wrap">
            <div class="bubble ${isMine ? 'mine' : 'theirs'}">${escapeHtml(data.message)}</div>
            <div class="msg-meta">${time} ${tick}</div>
          </div>
        </div>`);
    }

    /* ════════════════════════
       SEND MESSAGE
       API: WebSocket /app/chat.send
       Payload: { receiverId: UUID (string), message: String }
       Backend delivers to receiver's /user/queue/messages
    ════════════════════════ */
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text  = input.value.trim();
      if (!text || !selectedUserId || !stompClient) return;

      stompClient.send('/app/chat.send', {}, JSON.stringify({
        receiverId: selectedUserId,
        message:    text
      }));

     appendMessage({
    senderId: selectedUserId,
    senderUsername: loggedInUsername,
    message: text,
    createdAt: new Date().toISOString(),
    seen: false
}, true);

      input.value = '';
      autoResize(input);
      scrollToBottom();
      stopTypingSignal();
      loadUsers();
    }

    /* ════════════════════════
       TYPING SIGNAL
       API: WebSocket /app/chat.typing
       Payload: { receiverId: UUID (string), typing: boolean }
       Backend delivers to receiver's /user/queue/typing
    ════════════════════════ */
    function onTyping() {
      if (!selectedUserId || !stompClient) return;
      if (!isTyping) {
        isTyping = true;
        stompClient.send('/app/chat.typing', {}, JSON.stringify({ receiverId: selectedUserId, typing: true }));
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(stopTypingSignal, 2000);
    }

    function stopTypingSignal() {
      if (!isTyping || !stompClient || !selectedUserId) return;
      isTyping = false;
      stompClient.send('/app/chat.typing', {}, JSON.stringify({ receiverId: selectedUserId, typing: false }));
    }

    function showTyping(show) {
      document.getElementById('typingWrap').classList.toggle('show', show);
      if (show) scrollToBottom();
    }

    /* ════════════════════════
       IMAGE ATTACH
       Extend with: POST /messages/upload  field: "file"
       Response: { url: "https://..." }
    ════════════════════════ */
    function handleImageAttach(input) {
      const file = input.files[0];
      if (!file || !selectedUserId) return;
      const url  = URL.createObjectURL(file);
      const box  = document.getElementById('chatBox');
      const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      box.insertAdjacentHTML('beforeend', `
        <div class="msg-wrap mine" data-sender="mine">
          <img class="msg-av" src="${myProfilePic}" alt=""/>
          <div class="bubble-wrap" style="align-items:flex-end">
            <div class="bubble img-bubble mine"><img src="${url}" alt="image"/></div>
            <div class="msg-meta" style="justify-content:flex-end">
              ${time} <span class="seen-tick-pending">✓</span>
            </div>
          </div>
        </div>`);
      scrollToBottom();
      input.value = '';
      toast('Image preview — connect POST /messages/upload to save', 'info', 3500);
    }

    /* ════════════════════════
       EMOJI PANEL
    ════════════════════════ */
    const EMOJIS = ['😊','😂','❤️','🔥','👍','🎉','😍','🙌','💯','😎','🤔','👀','✅','🚀','💪','😢','🥳','🤝','💬','⭐','😅','🙏','🫡','😤','🤩'];
    (function() {
      const p = document.getElementById('emojiPanel');
      EMOJIS.forEach(e => {
        const b = document.createElement('button');
        b.className = 'e-btn'; b.textContent = e;
        b.onclick = () => {
          const i = document.getElementById('messageInput');
          i.value += e; i.focus(); autoResize(i);
        };
        p.appendChild(b);
      });
    })();
    function toggleEmoji() { document.getElementById('emojiPanel').classList.toggle('open'); }

    /* ════════════════════════
       HELPERS
    ════════════════════════ */
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function scrollToBottom(smooth = true) {
      const box = document.getElementById('chatBox');
      box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\n/g,'<br/>');
    }

    /*
     * Java LocalDateTime comes as:
     *   - Array: [2025, 5, 10, 9, 30, 0]
     *   - ISO string: "2025-05-10T09:30:00"
     * Handle both
     */
    function parseJavaDateTime(val) {
      if (!val) return null;
      if (Array.isArray(val)) {
        const [y, mo, d, h = 0, m = 0, s = 0] = val;
        return new Date(y, mo - 1, d, h, m, s);
      }
      return new Date(val);
    }

    function relativeTime(date) {
      if (!date) return '';
      const s = Math.floor((Date.now() - date) / 1000);
      if (s < 60)     return 'just now';
      if (s < 3600)   return Math.floor(s / 60) + 'm ago';
      if (s < 86400)  return Math.floor(s / 3600) + 'h ago';
      if (s < 604800) return Math.floor(s / 86400) + 'd ago';
      return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function formatDateLabel(ts) {
      const d    = new Date(ts);
      const diff = Math.floor((Date.now() - d) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    /* ════════════════════════
       FETCH MY PROFILE
       API: GET /user/post/profile/me
       Response: ProfileResponseDto { username, profilePic, ... }
       Used to identify which bubbles are "mine"
    ════════════════════════ */
    async function fetchMyProfile() {
      try {
        const res  = await fetch('/user/post/profile/me', { credentials: 'include' });
        const data = await res.json();
        loggedInUsername = data.username    || '';
        myProfilePic     = data.profilePic  || myProfilePic;
      } catch(e) {
        loggedInUsername = localStorage.getItem('username') || '';
        console.warn('fetchMyProfile fallback:', e);
      }
    }

    /* ════════════════════════
       INIT
    ════════════════════════ */
    window.addEventListener('load', async function() {
      await fetchMyProfile();
      connectSocket();
      loadUsers();
    });
</script>
</body>
